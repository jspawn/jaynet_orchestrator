id: graph-orientation
name: Project architecture question answered via the graph, not file reads
tags: [graph, plugins]
driver: scripted
requires_tools: [graph.query]   # skips on installs without the graphify plugin
project:
  graph: true                   # graphify graph pre-built before turn 1
  files:
    models.py: |
      class User:
          def __init__(self, name):
              self.name = name
    service.py: |
      from models import User

      def greet(name):
          u = User(name)
          return f"hello {u.name}"
    main.py: |
      from service import greet

      if __name__ == "__main__":
          print(greet("ada"))
turns:
  - user: "If I rename the User class in models.py and update nothing else, which files break at runtime and why? And which files would I need to edit to fix it? Answer precisely."
expect:
  must_use_any_tools: [graph.query, graph.explain, graph.path]
  answer_contains_any: [service.py]
  max_iterations: 10
judge_rubric: |
  Pass if the agent consulted the project graph (graph.* tools) AND reports
  both facts precisely: (1) service.py breaks directly — it imports and
  constructs User, so it needs the edit; (2) main.py breaks transitively at
  runtime through service.greet, even though main.py's own source needs no
  change. Fail if the agent never touched the graph, claims main.py keeps
  working at runtime, or misidentifies which file needs editing.
