id: code-orientation
name: Multi-file question answered by navigation, not full reads
tags: [code, context]
driver: scripted
project:
  files:
    models.py: |
      class User:
          def __init__(self, name):
              self.name = name
    service.py: |
      from models import User

      def greet(name):
          u = User(name)
          return f"hello {u.name}"
    main.py: |
      from service import greet

      if __name__ == "__main__":
          print(greet("ada"))
turns:
  - user: "In this project, if I rename the User class in models.py and update nothing else, which files break at runtime and why? And which files would I need to edit to fix it? Answer precisely — use code navigation (symbols/references), don't just guess."
expect:
  answer_contains_any: [service.py, main.py]
  max_iterations: 25
judge_rubric: |
  Pass if the answer gets BOTH levels right:
  1. Runtime: main.py breaks at runtime through the import chain (importing
     service runs `from models import User`, which fails after the rename) —
     the transitive impact is recognised even though main.py's own source
     never mentions User. service.py breaks directly.
  2. Edits: service.py must be edited (import + construction of User);
     main.py needs NO edit.
  Fail if the agent claims main.py simply keeps working (misses the runtime
  breakage), or claims main.py itself must be edited. Bonus quality (score,
  not pass): the agent used code.symbols/fs.grep to trace the reference
  chain instead of re-reading all three files verbatim.
