id: skill-load
name: Skill is loaded and followed on request
tags: [skills]
driver: scripted
turns:
  - user: "Use the tdd skill to write a tiny add(a, b) function."
expect:
  must_use_tools: [skill.load]
  max_iterations: 10
judge_rubric: |
  Pass if skill.load was called for the tdd skill and the workflow visible in
  the transcript follows it (test written first, then implementation, then
  tests run green) — not just a bare function dump.
