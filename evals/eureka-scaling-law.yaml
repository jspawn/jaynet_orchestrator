id: eureka-scaling-law
name: Discover the pendulum scaling law and its insight, not just a fit
tags: [eureka, science, code]
driver: scripted
turns:
  - user: "You are given measurements of a pendulum's period T (seconds) against its length L (metres):\nL, T\n0.1, 0.632\n0.2, 0.891\n0.3, 1.102\n0.5, 1.406\n0.7, 1.680\n0.9, 1.898\n1.2, 2.178\n1.5, 2.457\n1.8, 2.667\n2.2, 2.972\n2.6, 3.207\n3.0, 3.446\n\nFind the physical law connecting T and L. I do not want a curve fit — I want the mechanism: the functional form, the physical constant you can extract from the data (with its value), and one scientific insight that follows from this law (something a physicist would learn from it, e.g. a quantity the period does NOT depend on, or a regime where the law breaks). Use code to test hypotheses."
expect:
  max_iterations: 25
judge_rubric: |
  Pass only if ALL of these hold:
  1. The answer identifies a power-law/square-root relationship T proportional
     to sqrt(L) (exponent ≈ 0.5), not a polynomial or generic regression.
  2. It extracts the gravitational constant g from the data with a value
     between 9.3 and 10.3 m/s² (via T = 2π√(L/g) or equivalent).
  3. It states at least one genuine insight beyond the fit numbers — e.g. the
     period is independent of the bob's mass, or the law assumes small swing
     angles and breaks for large ones.
  Fail if the answer is only "best-fit polynomial with R² = …" or reports fit
  metrics without a mechanism — over-optimising predictive accuracy while
  missing the insight is exactly the failure mode this case probes.
