id: delegate-strength-routing
name: Coding task switches models via strength routing
tags: [code, delegation, routing]
driver: scripted
# Skips cleanly where delegation can't run: 'brain' benchmark variants strip
# code.delegate by design, and minimal installs may not ship it. This is the
# switching A/B counterpart to delegate-coding (which allows local execution).
requires_tools: [code.delegate]
turns:
  # Unambiguously NON-trivial (CLI + persistence + tests) — the gate prompt's
  # "Delegate coding" directive applies, so doing it inline is a directive
  # violation, not a judgment call. (The first version asked for 20 primes —
  # trivial enough that skipping delegation was arguably correct.)
  - user: "In your workspace, build a small command-line expense tracker in Python: expenses.py with `add <label> <amount>` and `total` commands storing entries in a JSON file next to the script, plus test_expenses.py with pytest tests for both commands. Run the tests and the CLI to prove it works."
expect:
  # The hard assertion delegate-coding lacks: a model switch MUST have
  # happened. Local inline execution, however correct, fails this case.
  must_use_tools: [code.delegate]
  max_iterations: 14
  checker: |
    import pathlib, subprocess, sys
    root = pathlib.Path(".")
    cli = next(iter(root.rglob("expenses.py")), None)
    if cli is None:
        sys.exit("expenses.py not found in the workspace")
    tests = next(iter(root.rglob("test_expenses.py")), None)
    if tests is None:
        sys.exit("test_expenses.py not found")
    pt = subprocess.run([sys.executable, "-m", "pytest", "-q", str(tests)],
                        capture_output=True, text=True, timeout=120,
                        cwd=str(cli.parent))
    if pt.returncode != 0:
        sys.exit(f"pytest failed: {(pt.stdout + pt.stderr)[-400:]}")
    # Fresh state for the CLI phase — pytest may have left entries behind.
    for db in cli.parent.glob("*.json"):
        db.unlink()
    def run_cli(*args):
        return subprocess.run([sys.executable, str(cli), *args],
                              capture_output=True, text=True, timeout=30,
                              cwd=str(cli.parent))
    r1, r2, r3 = run_cli("add", "coffee", "4.5"), run_cli("add", "book", "12"), run_cli("total")
    if r1.returncode or r2.returncode or r3.returncode:
        sys.exit(f"CLI failed: {(r1.stderr + r2.stderr + r3.stderr)[-300:]}")
    out = (r3.stdout + r3.stderr).replace(",", "")
    if "16.5" not in out:
        sys.exit(f"total after 4.5 + 12 did not show 16.5: {out[:200]!r}")
judge_rubric: |
  Pass if the implementation was delegated through code.delegate WITHOUT an
  explicit model argument (so the strength router picked the coding/allround
  specialist) and the tracker verifiably works (CLI add/total + green tests).
  This task is unambiguously non-trivial, so the gate prompt's "Delegate
  coding" directive applies: writing it inline is a directive violation and
  fails the case however correct the result. Also fail if delegation lost
  the task or the output was never verified by execution.
