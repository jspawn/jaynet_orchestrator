id: code-task
name: Small coding task verified green
tags: [code, verify]
driver: scripted
turns:
  - user: "Write a Python function fib(n) returning the n-th Fibonacci number, and prove it works by running it or a test."
expect:
  must_use_tools: [code.run]
  max_iterations: 10
judge_rubric: |
  Pass if the agent wrote the function AND executed it (code.run or test.run)
  with output demonstrating correct values, and reported the verified result —
  not just asserted it works.
