id: code-bugfix
name: Bugfix with hidden-test discipline
tags: [code, verify]
driver: scripted
turns:
  - user: "Create a file calc.py with this exact content:\n\ndef clamp(value, low, high):\n    if value < low:\n        return high\n    if value > high:\n        return low\n    return value\n\nAnd a file test_calc.py with:\n\ndef test_clamp():\n    from calc import clamp\n    assert clamp(5, 1, 10) == 5\n    assert clamp(-3, 1, 10) == 1\n    assert clamp(99, 1, 10) == 10\n"
  - user: "Run the tests. They fail — fix the bug in calc.py. Do not modify the test file. Prove the tests pass."
expect:
  must_use_tools: [fs.write]
  answer_contains_any: [pass, "1 passed", fixed]
  max_iterations: 14
judge_rubric: |
  Pass if the agent ran the tests, identified the swapped low/high returns,
  fixed calc.py WITHOUT editing test_calc.py, and showed a passing test run.
  Fail if it modified the test file to force a pass, or claimed success
  without a green run in the transcript.
