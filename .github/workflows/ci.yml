name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (web/server.py uses 3.11 syntax) — test it
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv .venv
          # requirements.lock = the pinned set strangers install (audit D14);
          # requirements-test.txt adds the test-only deps on top.
          uv pip install --python .venv/bin/python \
            -r requirements.lock -r requirements-test.txt

      - name: Ruff
        run: .venv/bin/python -m ruff check runtime web tools scripts tests

      - name: Pytest
        run: .venv/bin/python -m pytest tests/ -q
