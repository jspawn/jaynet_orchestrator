name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly floor-arm run, Monday 04:47 UTC (off the herd). Per-push CI
    # tests 3.14 only; the full matrix (incl. the 3.11 floor) runs here and
    # on manual dispatch — audit #25 demoted it: the floor class is rare
    # (B1 was the first ever), the promise stays tested, the per-push cost
    # (and a hung 3.11 arm burning the 15-min cap) goes.
    - cron: "47 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # a hung suite must fail named, not at 6h (QA-12)
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (web/server.py uses 3.11 syntax); 3.14 is
        # the interpreter dev + live actually run (readiness audit QA-6).
        python-version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["3.11", "3.14"]') || fromJSON('["3.14"]') }}
    steps:
      # fetch-depth 0: the baseline-bump gate diffs baselines against the
      # push/PR base and reads the range's commit messages.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv .venv
          # requirements.lock = the pinned set strangers install (audit D14);
          # requirements-test.txt adds the test-only deps on top.
          uv pip install --python .venv/bin/python \
            -r requirements.lock -r requirements-test.txt

      - name: Ruff
        run: .venv/bin/python -m ruff check runtime web tools scripts tests plugins

      # Complexity ceiling for NEW code (doc audit #12): C901 at 25, gated
      # via a committed baseline of grandfathered hotspots — NEW or GROWING
      # violations fail (same mechanism as the mypy baseline below).
      - name: Complexity (baseline)
        run: .venv/bin/python scripts/check_complexity.py

      # Prompt word budget (growth discipline 2026-10-08): the gate prompt
      # only ever grew — same baseline semantics as complexity: growth fails,
      # diets pass and can be banked with --write.
      - name: Prompt word budget
        run: .venv/bin/python scripts/check_prompt_size.py

      # Baseline growth must be a deliberate act: any RAISED baseline
      # (complexity / mypy / prompt budget) in the pushed range needs a
      # `baseline-bump: <what> (<reason>)` line in a commit message.
      # Pure shrinks (banked fixes) pass unmarked.
      - name: Baseline bump marker
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .venv/bin/python scripts/check_baseline_bump.py

      # docs/catalog.md is generated — fail when a commit forgot to regenerate
      # it (the third consecutive audit cycle with a freshness miss, #24 D2).
      - name: Catalog freshness
        run: |
          .venv/bin/python scripts/gen_catalog.py
          git diff --exit-code docs/catalog.md || {
            echo "::error::docs/catalog.md is stale — regenerate with scripts/gen_catalog.py"
            exit 1
          }

      # docs/rails.md is generated from the guard registries + the curated
      # dispatch-gate table (doc audit #2) — same freshness discipline.
      - name: Rails registry freshness
        run: .venv/bin/python scripts/gen_rails.py --check

      # Every tool name the docs mention must exist in the registry
      # (doc audit #14c; config-key/record-field lookalikes filtered).
      - name: Docs tool references
        run: .venv/bin/python scripts/check_doc_tools.py

      # Baseline gate: fails only on NEW mypy errors (see scripts/check_mypy.sh
      # header for the normalization mechanism; audit item 13).
      - name: Mypy (baseline)
        run: scripts/check_mypy.sh

      # Known-vulnerability audit of all three lockfiles (audit item 11).
      # litellm <=1.93 needs Python <3.14, so its lock is audited under 3.13.
      - name: pip-audit dependency lockfiles
        run: |
          uv pip install --python .venv/bin/python pip-audit
          .venv/bin/python -m pip_audit -r requirements.lock --no-deps
          .venv/bin/python -m pip_audit -r requirements-tools.lock --no-deps
          uv run --python 3.13 --with pip-audit \
            pip-audit -r requirements-litellm.lock --no-deps

      - name: Pytest
        # -n 2 halves wall time on the 2-core runners; conftest re-anchors
        # each xdist worker to a private data dir (shared users.db raced).
        run: .venv/bin/python -m pytest tests/ -q -n 2
