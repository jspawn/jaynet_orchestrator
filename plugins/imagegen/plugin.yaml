# Imagegen plugin — local text-to-image through pluggable backends.
# Swaps the configured slot (default: specialist) out for the generation
# backend, generates, and swaps back after an idle keep-warm window.
name: imagegen
version: 0.2.0
description: >-
  Local image generation through a selectable backend (default: Qwen-Image
  GGUF via stable-diffusion.cpp sd-server). image.generate hibernates the
  configured model slot, hands the PNG to the user as a download, and
  restores the slot after an idle keep-warm window (default 600s) so image
  batches pay the swap once.
requires_jaynet: ">=1.12.0"
dependencies: []
# Reported in the Plugins subtab when missing, never blocking.
requires_bins: []
