# Benchlab plugin — import public agent-benchmark tasks as JayNet eval cases.
# Terminal-Bench comes from a git clone (Apache-2.0); GAIA Level-1 from the
# gated HF dataset over the HTTP API with the admin's own HF_TOKEN — no pip
# dependencies beyond the stdlib.
name: benchlab
version: 0.1.0
description: >-
  Import public agent-benchmark tasks (Terminal-Bench, GAIA) as eval cases
  that run through the JayNet eval harness (bench.sources / bench.fetch /
  bench.import).
requires_jaynet: ">=1.1.0"
dependencies: []
# Executables the plugin's features use — reported in the Plugins tab when
# missing, never blocking: git is for bench.fetch, podman only for full mode.
requires_bins: [git, podman]
