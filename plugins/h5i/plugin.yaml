# h5i plugin — browser sessions and captured traffic for agents. One tool,
# browser.browse, covers the whole flow: open (h5i 0.5 captures by default) →
# snapshot (@refs) → click/type/submit/scroll/waitfor →
# extract/structured/transcript/markdown → screenshot → requests/audit →
# close. h5i 0.5 doubles as an authorized-security-testing browser: the
# recon/websec/test plugins
# (separate binaries, `h5i plugin install --from <path>`) add the endpoint
# ledger, replay/mutate/diff/findings, multi-send orchestration (experiment/
# matrix/sequence/socket/dom/grpc) and oracle-checked attack-flow replay on
# top of the traffic this tool captures.
# Complements the Chromium lane (kept for full-page screenshots and PDFs) —
# h5i has no PDF pipeline.
name: h5i
version: 0.3.0
description: >-
  The h5i red-team browser (h5i 0.5 via agent-browser): browser.browse —
  open/snapshot/click/type/submit/scroll/
  waitfor/extract/structured/transcript/markdown/screenshot with domain
  allowlists and an auditable traffic log (capture → requests/audit).
  Doubles as the authorized security-testing lane (h5i recon/websec/test
  plugins: endpoint ledger, HTTP workbench, oracle-checked attack flows);
  Chromium stays for PDFs.
requires_jaynet: ">=1.1.0"
dependencies: []
# The h5i binary is the only requirement — reported in the Plugins subtab when
# missing, never blocking. Install (no sudo, lands in ~/.local/bin — JayNet
# finds it there even when the service PATH doesn't):
#   curl -fsSL https://h5i.dev/install.sh | sh
requires_bins: [h5i]
