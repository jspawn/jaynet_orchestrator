# Jev plugin — typed probability decisions from a local Open-Jev server.
# Open-Jev (https://github.com/Zefan-Cai/Open-Jev) is a decision model: state
# + typed questions in, calibrated probabilities out, one forward pass, no
# text generation. The model server is a SIDECAR you run yourself (see
# README.md); this plugin talks plain HTTP to it and needs no pip deps.
name: jev
version: 0.2.0
description: >-
  Decision-model integration (Open-Jev/jevify): jev.decide answers
  choice/yes-no/score questions with calibrated probabilities, and an
  optional route_request hook classifies requests for delegation. The admin
  UI probes and manages jevify against a selected local model preset.
requires_jaynet: ">=1.1.0"
