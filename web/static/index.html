<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JayNet</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/vendor/codemirror/cm.css">
<script src="/static/vendor/codemirror/cm-bundle.js"></script>
</head>
<body>
<header>
  <button class="ghost icon-btn" id="chatsToggle" title="Toggle chats panel" aria-label="Toggle chats panel">☰</button>
  <span class="hash" id="dot">#</span>
  <b>JayNet</b>
  <span style="color:var(--muted);font-size:12px" id="status">idle</span>
  <button class="ghost icon-btn" id="newChatTop" style="margin-left:auto" title="New chat" aria-label="New chat">＋</button>
  <button class="ghost icon-btn" id="saveBtn" title="Save / unsave this chat" aria-label="Save chat">☆</button>
  <button class="ghost icon-btn" id="cancel" title="Cancel run" aria-label="Cancel run" disabled>⏹</button>
  <button class="ghost icon-btn" id="toolsToggle" title="Toggle tools panel" aria-label="Toggle tools panel">🛠</button>
  <a class="ghost icon-btn adminlink" id="adminLink" href="/admin" title="Admin" aria-label="Admin" style="display:none">⚙</a>
  <a class="ghost icon-btn" id="accountLink" href="/account" title="Account &amp; usage" aria-label="Account">👤</a>
  <span class="who" id="who"></span>
  <button class="ghost" id="logout">logout</button>
</header>
<main>
  <aside id="sidebar">
    <div class="head proj-head">
      <select id="projSelect" title="Active project"><option value="">— no project —</option></select>
      <div class="proj-actions">
        <button class="ghost" id="newProj">＋ project</button>
        <button class="ghost" id="projFromChat" title="Create a project from this chat (moves its files in and saves the chat into it)">⤵ from chat</button>
        <button class="ghost icon-btn" id="delProj" title="Delete project" aria-label="Delete project">🗑</button>
      </div>
    </div>
    <div id="projPanel" hidden>
      <div class="head" style="justify-content:space-between;padding:2px">
        <b style="font-size:12px">Files</b>
        <span class="proj-fileacts"><button class="ghost icon-btn" id="projNewFile" title="New file" aria-label="New file">＋</button>
              <button class="ghost icon-btn" id="projUpload" title="Upload files" aria-label="Upload files">⬆</button></span>
      </div>
      <div id="fileTree"></div>
      <input type="file" id="projFileInput" multiple hidden>
    </div>
    <div class="head"><button id="newChat">＋ new chat</button></div>
    <div id="chatList"></div>
  </aside>
  <section id="chat">
    <div id="hero" aria-hidden="true">
      <canvas></canvas>
      <div class="logo">#&nbsp;#&nbsp;#<br>&nbsp;&nbsp;#&nbsp;#<br>#&nbsp;&nbsp;&nbsp;#</div>
    </div>
    <div id="chatcol">
      <div id="log"></div>
      <div id="chips"></div>
      <form id="form">
        <button type="button" class="attach" id="attachBtn" title="Attach files or images">📎</button>
        <input type="file" id="fileInput" multiple hidden>
        <textarea id="input" placeholder="Ask, if you dare…"></textarea>
        <button class="send" id="send" title="Send" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
      </form>
      <div class="disclaimer">JayNet is Alpha - check all and everything :)</div>
    </div>
  </section>
  <aside id="toolbar">
    <div class="head"><b>Tools</b>
      <button class="mini" id="allOn">all</button><button class="mini" id="allOff">none</button></div>
    <div id="toolList"></div>
    <div class="optsbar">
      <div class="opthead">Run options</div>
      <div class="trow opt"><span class="tname">share private with cloud</span>
        <label class="sw"><input type="checkbox" id="share"><span class="sl"></span></label></div>
      <div class="trow opt"><span class="tname">auto-approve tools</span>
        <label class="sw"><input type="checkbox" id="auto"><span class="sl"></span></label></div>
      <div class="trow opt"><span class="tname">thinking</span>
        <label class="sw"><input type="checkbox" id="think" checked><span class="sl"></span></label></div>
      <div class="opthead">Budget · this run</div>
      <div class="trow opt"><span class="tname">max iterations</span>
        <input type="number" id="bMaxIter" class="optnum" min="1" step="1" placeholder="20"></div>
      <div class="trow opt"><span class="tname">wall clock · s</span>
        <input type="number" id="bWall" class="optnum" min="1" step="10" placeholder="300"></div>
      <div class="trow opt"><span class="tname">max cost · $</span>
        <input type="number" id="bCost" class="optnum" min="0" step="0.1" placeholder="1.0"></div>
      <div class="trow opt"><span class="tname">max tokens</span>
        <input type="number" id="bTok" class="optnum" min="1" step="1000" placeholder="600000"></div>
    </div>
  </aside>
</main>
<div id="editorModal" class="edmodal" hidden>
  <div class="edmodal-card">
    <div class="edmodal-head">
      <span class="ed-path" id="editorPath"></span>
      <button class="mini" id="editorSave">save</button>
      <button class="mini" id="editorClose">close</button>
    </div>
    <textarea id="editorArea" spellcheck="false"></textarea>
    <div class="ed-msg" id="editorMsg"></div>
  </div>
</div>
<div id="drawerScrim"></div>

<div id="modal"><div class="box"><p id="modalText"></p>
  <div class="row"><button class="no" id="modalNo">cancel</button><button class="yes" id="modalYes">delete</button></div>
</div></div>

<script src="/static/app.js"></script>
</body>
</html>
