<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JayNet Orchestrator — sign in</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--border:#2a313c;--fg:#d7dde5;
    --muted:#8b97a7;--accent:#5db0ff;--err:#f07178}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--fg);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:28px;width:320px}
  h1{font-size:18px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
  label{display:block;color:var(--muted);font-size:12px;margin:12px 0 4px}
  input{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--border);
    border-radius:8px;padding:9px 11px;font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:18px;background:var(--accent);color:#05121f;border:0;
    border-radius:8px;padding:10px;font-weight:600;cursor:pointer}
  .err{color:var(--err);font-size:12px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
  <div class="card">
    <h1>JayNet Orchestrator</h1>
    <div class="sub">Sign in to continue</div>
    <form id="f">
      <label for="u">Username</label>
      <input id="u" autocomplete="username" autofocus>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password">
      <div id="codewrap" style="display:none">
        <label for="c">Authenticator code</label>
        <input id="c" inputmode="numeric" autocomplete="one-time-code"
               placeholder="6-digit or backup code">
      </div>
      <button type="submit" id="btn">Sign in</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
  const $=s=>document.querySelector(s);
  let needCode=false;
  $("#f").addEventListener("submit", async e=>{
    e.preventDefault(); $("#err").textContent="";
    const body={username:$("#u").value, password:$("#p").value};
    if(needCode) body.code=$("#c").value;
    const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(body)});
    if(r.ok){ location.href="/"; return; }
    let detail=""; try{ detail=(await r.json()).detail||""; }catch(_){}
    if(r.status===401 && detail==="totp_required"){
      needCode=true; $("#codewrap").style.display=""; $("#c").focus();
      $("#btn").textContent="Verify"; $("#err").textContent="Enter your authenticator code.";
    } else if(r.status===401 && detail==="invalid two-factor code"){
      $("#err").textContent="Invalid code — try again.";
    } else {
      $("#err").textContent = r.status===401 ? "Invalid username or password." : ("Error "+r.status);
    }
  });
</script>
</body>
</html>
