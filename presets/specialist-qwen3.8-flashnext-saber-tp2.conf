# Qwen3.8 Flash-Next on Saber, TWO R9700s (TP=2), trunk8 + FP8 KV.
# Pack: qwen38-flashnext-quark-trunk8, including rank0/rank1 and PLE data.
# Fetch: SABER_PACKS=$ORCH_MODELS/saber-models/saber-packs \
#   ~/jaynet-build/saber-rocm/tools/fetch_packs.sh flashnext
# The pack manifest references the original checkpoint; keep that checkpoint
# at the recorded path. Register $BIN_DIR/saber.rocm/bin/saber as type=saber.
# Catalog defaults: port 8080, GPUs 0,1, served_id qwen38-flashnext-saber-tp2;
# caps vision+thinking=true; profile think_strip=qwen3, system_first=true,
# temp=0.6/top_p=0.95 (strict template: system text only at index 0).
SERVER=saber
SABER_MODEL=flashnext
MODEL_PATH=$ORCH_MODELS/saber-models/saber-packs/qwen38-flashnext-quark-trunk8
ALIAS=qwen38-flashnext-saber-tp2
HOST=127.0.0.1
PORT=8080
VISIBLE_DEVICES=0,1
CTX_SIZE=262144
EXTRA_ARGS=--fn-vision lazy
