# Qwen3.8-27B on Saber, ONE R9700 (TP=1) + its DFlash2 drafter.
# The single-card packs are pre-sharded; TP=2 packs cannot be substituted.
# Build: BIN_DIR=$HOME/jaynet-bin AMDGPU_TARGETS=gfx1201 scripts/build_tools.sh saber rocm
# Container fallback: add SABER_BUILD=container to the build command.
# Fetch: SABER_PACKS=$ORCH_MODELS/saber-packs ~/jaynet-build/saber-rocm/tools/fetch_packs.sh 27b-tp1
# Register $BIN_DIR/saber.rocm/bin/saber with type=saber and empty device_env.
# Catalog defaults: port 8080, GPU 1, served_id qwen38-saber-tp1;
# caps vision+thinking=true; profile think_strip=qwen3, temp=0.6/top_p=0.95.
SERVER=saber
MODEL_PATH=$ORCH_MODELS/saber-packs/qwen38-27b-nvfp4-devfinal-tp1-fp8head
MTP_MODEL=$ORCH_MODELS/saber-packs/qwen38-dflash2-drafter-tp1-fp8head
ALIAS=qwen38-saber-tp1
HOST=127.0.0.1
PORT=8080
VISIBLE_DEVICES=1
CTX_SIZE=65536
MAX_NUM_SEQS=4
EXTRA_ARGS=--enable-prefix-caching on --vision lazy
