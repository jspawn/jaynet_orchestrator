# Inkling 2 Mini on Saber, TWO R9700s (TP=2), text-only, 256K context.
# Self-contained NVFP4/MXFP8 expert, int8 trunk, and bundled block-drafter pack:
# https://huggingface.co/Launch80/Inkling-2-Mini-NVFP4-SABER (20.73 GB).
# Fetch: SABER_NVME=$ORCH_MODELS/saber-models tools/fetch_packs.sh inkling
# Source: /srv/saber-jaynet-dev; native launcher tools/serve_inkling_native.sh.
# Catalog defaults: port 8080, GPUs 0,1, served_id inkling-2-mini-saber-tp2;
# caps vision=false/thinking=false; profile think_strip=none, system_first=false,
# tool_selection=auto, sampling temp=1 (checkpoint default). The server exposes
# reasoning separately; thinking=false only suppresses JayNet's unsupported
# enable_thinking switch (use OpenAI reasoning_effort when calling it directly).
# Inkling reasoning/tool parsers support tool-driven delegation. One request runs.
# The model advertises 1M context; 256K allocation and a real 140047-token request
# passed. This preset keeps 256K and one prefix-cache node by disabling the
# drafter; the standalone launcher instead defaults to drafter-on/cache-off.
# This configuration uses 22.77 GiB/rank. Tools, tool-result follow-up, reasoning,
# streaming and clean shutdown passed; the cached probe reported 194 tokens.
# Cached prompt tokens are reported in prompt_tokens_details. Larger contexts
# and multiple sequences are unvalidated.
SERVER=saber
SABER_MODEL=inkling
SABER_REPO=/srv/saber-jaynet-dev
SABER_BIN=/srv/saber-jaynet-dev/target/release/saber
MODEL_PATH=$ORCH_MODELS/saber-models/saber-packs/inkling-2-mini-nvfp4
ALIAS=inkling-2-mini-saber-tp2
HOST=127.0.0.1
PORT=8080
VISIBLE_DEVICES=0,1
CTX_SIZE=262144
MAX_NUM_SEQS=1
EXTRA_ARGS=--ink-prefix-cache 1 --ink-mtp 0
