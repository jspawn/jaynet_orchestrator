# Occamy on Saber, TWO consecutive R9700s (TP=2), text-only, 262K context.
# Official FP8 routed experts + BF16 dense/shared/KV + FP32 GDN state.
# Source: /srv/saber-jaynet-dev; native launcher tools/serve_occamy_native.sh.
# Pack paths below are the conventional layout; the live converted packs may
# instead live beside the fork. Keep the default 4096 MiB/rank prefix cache.
# MTP is disabled: sampled/penalty verification is currently slower than decode.
# Catalog defaults: port 8090, GPUs 0,1, served_id occamy-fp8-saber-tp2;
# caps vision=false/thinking=true; profile think_strip=qwen3, system_first=true,
# temp=1/top_p=.95 (strict template: system text only at index 0).
SERVER=saber
SABER_MODEL=occamy
SABER_REPO=/srv/saber-jaynet-dev
SABER_BIN=/srv/saber-jaynet-dev/target/release/saber
MODEL_PATH=$ORCH_MODELS/saber-packs/occamy-fp8-all-layers
OCCAMY_LAYERS=$ORCH_MODELS/saber-packs/occamy-bf16-all-layers
OCCAMY_GLOBALS=$ORCH_MODELS/saber-packs/occamy-bf16-globals
OCCAMY_CHECKPOINT=$ORCH_MODELS/radconv/occamy-1.0
ALIAS=occamy-fp8-saber-tp2
HOST=127.0.0.1
PORT=8090
VISIBLE_DEVICES=0,1
CTX_SIZE=262144
MAX_NUM_SEQS=1
