# Occamy on Saber, TWO consecutive R9700s (TP=2), text-only, 262K context.
# Official FP8 routed experts + BF16 dense/shared/KV + FP32 GDN state.
# Requires an Occamy-capable Saber fork. Set SABER_REPO and SABER_BIN in the
# live catalog when its binary is not $SABER_REPO/target/release/saber.
# Pack paths below are the conventional layout; the live converted packs may
# instead live beside the fork. MTP is the official BF16 head, greedy depth 1.
# Catalog defaults: port 8090, GPUs 0,1, served_id occamy-fp8-saber-tp2;
# caps vision=false/thinking=true; profile think_strip=qwen3, temp=1/top_p=.95.
SERVER=saber
SABER_MODEL=occamy
MODEL_PATH=$ORCH_MODELS/saber-packs/occamy-fp8-all-layers
OCCAMY_LAYERS=$ORCH_MODELS/saber-packs/occamy-bf16-all-layers
OCCAMY_GLOBALS=$ORCH_MODELS/saber-packs/occamy-bf16-globals
OCCAMY_CHECKPOINT=$ORCH_MODELS/radconv/occamy-1.0
MTP_MODEL=$ORCH_MODELS/radconv/mtp/mtp-trained.safetensors
SPEC_DRAFT_N_MAX=1
ALIAS=occamy-fp8-saber-tp2
HOST=127.0.0.1
PORT=8090
VISIBLE_DEVICES=0,1
CTX_SIZE=262144
MAX_NUM_SEQS=1
