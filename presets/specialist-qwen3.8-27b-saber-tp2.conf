# Qwen3.8-27B on Saber, TWO R9700s (TP=2) + its DFlash2 drafter.
# The two-rank packs are pre-sharded; TP=1 packs cannot be substituted.
# Source: /srv/saber-jaynet-dev (branch jaynet-integration); native launcher
# tools/serve_27b_native.sh. Assets stay under saber-models/saber-packs.
# Register scripts/saber-serve.sh with type=saber and empty device_env.
# Catalog defaults: port 8080, GPUs 0,1, served_id qwen38-saber-tp2;
# caps vision+thinking=true; profile think_strip=qwen3, temp=0.6/top_p=0.95.
SERVER=saber
SABER_REPO=/srv/saber-jaynet-dev
SABER_BIN=/srv/saber-jaynet-dev/target/release/saber
MODEL_PATH=$ORCH_MODELS/saber-models/saber-packs/qwen38-27b-nvfp4-devfinal-fp8head
MTP_MODEL=$ORCH_MODELS/saber-models/saber-packs/qwen38-dflash2-drafter-fp8head
ALIAS=qwen38-saber-tp2
HOST=127.0.0.1
PORT=8080
VISIBLE_DEVICES=0,1
CTX_SIZE=262144
MAX_NUM_SEQS=8
EXTRA_ARGS=--enable-prefix-caching on --vision lazy
