# Ripple-65B-Preview-NVFP4 on Saber, TWO R9700s (TP=2) + official DFlash2.
# Target MLPs are converted to MXFP4; attention/head are BF16 and KV is FP8.
# Sources: ricursiveAI/Ripple-65B-Preview-NVFP4 and Ripple-65B-Preview-DFlash2.
# Requires a Ripple-capable Saber checkout; set SABER_REPO when the registered
# lifecycle wrapper's default checkout does not contain ripple-serve.
# Catalog defaults: port 8080, GPUs 0,1, served_id ripple-65b-saber-tp2;
# caps vision=false/thinking=true; profile think_strip=qwen3, system_first=true,
# sampling temperature=0.0. One request executes at a time; clients queue.
SERVER=saber
SABER_MODEL=ripple
MODEL_PATH=$ORCH_MODELS/saber-models/saber-packs/ripple-65b-preview-mxfp4-tp2
MTP_MODEL=$ORCH_MODELS/saber-models/saber-packs/ripple-65b-dflash2-fp8-runtime-tp2
RIPPLE_CHECKPOINT=$ORCH_MODELS/saber-models/models/Ripple-65B-Preview-NVFP4
ALIAS=ripple-65b-saber-tp2
HOST=127.0.0.1
PORT=8080
VISIBLE_DEVICES=0,1
CTX_SIZE=131072
MAX_NUM_SEQS=1
