# EXAMPLE brain upgrade — Qwen3-30B-A3B-Instruct-2507 (Apache-2.0).
#
# Why a MoE brain: 30B parameters total, but only ~3B are active per token,
# so it answers at small-model speed while drawing on big-model knowledge —
# the sweet spot for an orchestrator brain that runs all day on one GPU.
#
# This preset shares the brain slot with the default `brain` preset (same
# port + GPU): only one of them runs at a time. Try it with
# model.use('brain-moe', swap: true), or make it the boot brain in
# admin → Presets → Model slots.
#
# Download: scripts/pull-model Qwen/Qwen3-30B-A3B-Instruct-2507-GGUF
# (or admin → Presets → Download from HuggingFace; either lands at the path
# below). Needs ~20 GB VRAM at Q4_K_M — drop to a smaller quant or set
# GPU_LAYERS lower (partial CPU offload) on smaller cards.
MODEL_PATH=$ORCH_MODELS/Qwen/Qwen3-30B-A3B-Instruct-2507-GGUF/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
ALIAS=qwen3-30b-a3b
BACKEND=rocm
HOST=127.0.0.1
PORT=8090
GPU_LAYERS=99
CTX_SIZE=32768
TEMP=0.7
TOP_K=20
TOP_P=0.8
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=-1
BATCH_SIZE=2048
UBATCH_SIZE=512
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
FLASH_ATTN=on
JINJA=yes
REASONING_FORMAT=
EXTRA_ARGS=
TOOLS_TEMPLATE=
SPLIT_MODE=none
TENSOR_SPLIT=
VISIBLE_DEVICES=0
