# Brain preset — Hermes3.6 V4 APEX with MTP (nextn head verified in the GGUF).
# RETIRED: MTP was buggy — V5 (no MTP) is the live brain. Kept as the rollback
# path; MTP self-speculative decoding is ON here (the whole point of this build).
MODEL_PATH=$ORCH_MODELS/LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-V4-MTP-GGUF/Hermes3.6-35B-A3B-Uncensored-Genesis-V4-MTP-APEX.gguf
ALIAS=Hermes3.6-35B-A3B-uncens-genesis-V4-APEX
MMPROJ=$ORCH_MODELS/LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-V4-MTP-GGUF/mmproj-Hermes3.6-35B-A3B-Uncensored-Genesis-F16.gguf
MMPROJ_OFFLOAD=on
MTP=on
# draft tokens per step: 2 is conservative, 4 gambles on acceptance — 3 is the
# middle; benchmark on real traffic and tune here.
SPEC_DRAFT_N_MAX=3
BACKEND=rocm
HOST=127.0.0.1
#PORT=8091
GPU_LAYERS=99
CTX_SIZE=262144
TEMP=0.6
TOP_K=20
TOP_P=0.95
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=-1
BATCH_SIZE=2048
UBATCH_SIZE=512
# KV quant: q8_0 (not f16) — halves KV VRAM at 256k ctx, matching the
# specialist slot; the headroom is what keeps GPU0 out of OOM territory.
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
FLASH_ATTN=on
JINJA=yes
REASONING_FORMAT=
EXTRA_ARGS=
TOOLS_TEMPLATE=$ORCH_MODELS/chat_templates/qwen3.6_tools.jinja
SPLIT_MODE=none
TENSOR_SPLIT=
VISIBLE_DEVICES=0
