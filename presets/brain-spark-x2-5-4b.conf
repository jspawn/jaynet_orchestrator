# EXAMPLE brain — Spark-X2.5-4B (XHToken), Q8_0, the bakeoff-champion router.
#
# Why this brain: Spark is routing-tuned — in docs/brain-bakeoff.md it holds
# the best fixed-list score (18/32 = 56%) of every orchestrator brain tried.
# 4B keeps routing turns cheap; the heavy work belongs to the specialist.
#
# spark2_5 arch needs llama.cpp >= b10828 (native) — the local ROCm build
# (b11151) covers it, no fork binary. Download: admin → Presets → Download
# from HuggingFace (XHToken/Spark-X2.5-4B-GGUF, Q8_0 ≈ 4.4 GB).
MODEL_PATH=$ORCH_MODELS/XHToken/Spark-X2.5-4B-GGUF/Spark-X2.5-4B-Q8_0.gguf
ALIAS=spark-x2-5-4b
BACKEND=rocm
HOST=127.0.0.1
PORT=8090
GPU_LAYERS=99
# 261k ctx across both GPUs (tensor 5,5). f16 KV ≈ 39 GiB at this ctx
# (q8_0 was ~19.6) — split across 2×32 GB it fits with room; on a single
# GPU drop CACHE_TYPE_* to q8_0 or CTX_SIZE to 131072.
CTX_SIZE=261120
CACHE_TYPE_K=f16
CACHE_TYPE_V=f16
SPLIT_MODE=tensor
TENSOR_SPLIT=5,5
VISIBLE_DEVICES=0,1
# Sampling: card says temp 1.0 / top_p 0.95 / top_k -1 — the bakeoff columns
# ran 0.75, which held instruction-contract cases steadier. Ladder A/B
# between 0.3/0.7/1.0 is queued; 0.75 is the proven middle.
TEMP=0.75
TOP_K=-1
TOP_P=0.95
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=8
BATCH_SIZE=2048
UBATCH_SIZE=512
FLASH_ATTN=on
MMAP=on
MTP=off
JINJA=yes
EMBEDDINGS=off
MMPROJ_OFFLOAD=off
REASONING_FORMAT=
EXTRA_ARGS=
TOOLS_TEMPLATE=
# Cap thinking per turn: uncapped, Spark burned the full 8192 completion cap
# on reasoning, truncated, then looped on `todos` (live, tb-regex-log).
REASONING_BUDGET=4096
