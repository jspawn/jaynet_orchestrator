# EXAMPLE brain — Spark-X2.5-1.7B (XHToken), Q8_0, mini-me bakeoff column.
#
# Why this brain: same spark2_5 routing tune as the 52/89 champion
# (Spark-X2.5-4B) at less than half the weights — the bakeoff question is
# whether routing discipline survives the shrink. If it holds anywhere near
# the 4B column, brain turns get even cheaper.
#
# spark2_5 arch needs llama.cpp >= b10828 (native) — the local ROCm build
# (b11151) covers it. Download: admin → Presets → Download from HuggingFace
# (XHToken/Spark-X2.5-1.7B-GGUF, Q8_0 ≈ 1.8 GB).
MODEL_PATH=$ORCH_MODELS/XHToken/Spark-X2.5-1.7B-GGUF/Spark-X2.5-1.7B-Q8_0.gguf
ALIAS=spark-x2-5-1-7b
BACKEND=rocm
HOST=127.0.0.1
PORT=8090
GPU_LAYERS=99
# Mirrors the 4B champion config exactly (262144 ctx, f16 KV, tensor 5,5) so
# the column isolates model size as the only variable. At 1.7B the model
# itself is ~1.8 GB — a single-GPU variant (SPLIT_MODE=none, GPU 0) is a
# valid follow-up A/B if this column holds up.
CTX_SIZE=262144
CACHE_TYPE_K=f16
CACHE_TYPE_V=f16
SPLIT_MODE=tensor
TENSOR_SPLIT=5,5
VISIBLE_DEVICES=0,1
# Sampling identical to the champion column (temp ladder lesson 14 queued
# separately; flip both Sparks together if 0.3 wins).
TEMP=0.75
TOP_K=-1
TOP_P=0.95
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=8
BATCH_SIZE=2048
UBATCH_SIZE=512
FLASH_ATTN=on
MMAP=on
MTP=off
JINJA=yes
EMBEDDINGS=off
MMPROJ_OFFLOAD=off
REASONING_FORMAT=
EXTRA_ARGS=
TOOLS_TEMPLATE=
# Cap thinking per turn: uncapped, Spark burned the full 8192 completion cap
# on reasoning, truncated, then looped on `todos` (live, tb-regex-log).
REASONING_BUDGET=4096
