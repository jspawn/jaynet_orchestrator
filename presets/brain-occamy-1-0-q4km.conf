# Brain candidate — Occamy-1.0 Q4_K_M with EMBEDDED MTP head (fetchingcat's
# build, qwen35moe arch, official non-abliterated weights). The quality-tier
# sibling of brain-occamy-1-0.conf (APEX-I-MiniPlus abliterated): same base,
# cleaner quant + official conversion. Q4_K_M matches cyber-tiel's tier for
# the brain A/B. MTP=on uses the embedded head — no MTP_MODEL needed.
# Vision via fetchingcat's F16 mmproj. Sampling identical to the MiniPlus
# preset so the two quants compare 1:1.
# Download: scripts/pull-model fetchingcat/occamy-1.0-mtp-gguf
MODEL_PATH=$ORCH_MODELS/fetchingcat/occamy-1.0-mtp-gguf/occamy-1.0-mtp-Q4_K_M.gguf
MTP=on
SPEC_DRAFT_N_MAX=2
MMPROJ=$ORCH_MODELS/fetchingcat/occamy-1.0-mtp-gguf/mmproj-occamy-1.0-F16.gguf
MMPROJ_OFFLOAD=on
MEDIA_MARKER=jaynet-brain-vlm
CTX_SIZE=262144
GPU_LAYERS=99
TEMP=1.0
TOP_K=20
TOP_P=0.95
MIN_P=0
REPEAT_PENALTY=1.0
FLASH_ATTN=on
SPLIT_MODE=none
MMAP=on
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
TOOLS_TEMPLATE=$ORCH_MODELS/chat_templates/qwen3.6_tools.jinja
THREADS=8
JINJA=yes
REASONING_BUDGET=4096
REASONING_EFFORT=high
ALIAS=occamy-1-0-q4km
HOST=127.0.0.1
PORT=8090
