# Brain candidate — Occamy-1.0 (Qwen3.6-35B-A3B base, Accio-Lab, Apache-2.0),
# APEX-I-MiniPlus-V2.1-Abliterated quant by IsValorum (~14 GB) + separate
# Q8_0 MTP draft head + Q8_0 mmproj. Post-trained for long-horizon co-work:
# tool-call grounding, state tracking, recovery, continuity across context
# compaction — i.e. the orchestrator-brain job description. Same base arch as
# cyber-tiel, so same VRAM/speed class on the brain slot (GPU 0 :8090).
#
# MTP here is a SEPARATE draft file (MTP_MODEL) — needs a launcher with
# MTP_MODEL support (start-model.sh ≥ v1.22.x); without it MTP=on errors.
# Vision via mmproj (frozen encoder) — MEDIA_MARKER pins the brain VLM lane.
# Sampling cloned from cyber-tiel for a clean A/B; the model card suggests
# temp 1.0 / top_p 0.95 / presence_penalty 1.5 / top_k 20 with thinking on.
# Quantizer ships its own chat_template.jinja next to the GGUF if
# qwen3.6_tools.jinja ever misbehaves.
# Download: scripts/pull-model IsValorum/Occamy-1.0-APEX-I-MiniPlus-V2.1-Abliterated-GGUF
MODEL_PATH=$ORCH_MODELS/IsValorum/Occamy-1.0-APEX-I-MiniPlus-V2.1-Abliterated-GGUF/Occamy-1.0.APEX-I-MiniPlus-V2.1-Abliterated.gguf
MTP=on
MTP_MODEL=$ORCH_MODELS/IsValorum/Occamy-1.0-APEX-I-MiniPlus-V2.1-Abliterated-GGUF/occamy-1.0-mtp-Q8_0.gguf
SPEC_DRAFT_N_MAX=2
MMPROJ=$ORCH_MODELS/IsValorum/Occamy-1.0-APEX-I-MiniPlus-V2.1-Abliterated-GGUF/mmproj-Q8_0.gguf
MMPROJ_OFFLOAD=on
MEDIA_MARKER=jaynet-brain-vlm
CTX_SIZE=262144
GPU_LAYERS=99
TEMP=1.0
TOP_K=20
TOP_P=0.95
MIN_P=0
REPEAT_PENALTY=1.0
FLASH_ATTN=on
SPLIT_MODE=none
MMAP=on
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
TOOLS_TEMPLATE=$ORCH_MODELS/chat_templates/qwen3.6_tools.jinja
THREADS=8
JINJA=yes
REASONING_BUDGET=4096
REASONING_EFFORT=high
ALIAS=occamy-1-0
HOST=127.0.0.1
PORT=8090
