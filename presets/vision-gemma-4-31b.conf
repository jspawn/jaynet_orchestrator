# Vision specialist — Google Gemma 4 31B it (QAT Q4_0) + mmproj, GPU-served.
# Serves the local-vision alias: llm.call(images=[...]) routes here for image
# description/OCR when no explicit model is given. Assign it to the 'vision'
# slot in Admin → Models → Presets. Unlike the old CPU helper (Qwen2.5-VL-3B)
# this one needs a GPU: ~18.8 GB weights+projector — the swapper hibernates
# whatever occupies its card when a vision call lands. MMPROJ is the
# multimodal projector — without it the server is text-only. Requires a
# recent llama.cpp build with gemma-4 vision support.
# Download: scripts/pull-model <gemma-4-31B-it QAT Q4_0 GGUF + mmproj>
MODEL_PATH=$ORCH_MODELS/google/gemma-4-31B-it-qat-q4_0-gguf/gemma-4-31B_q4_0-it.gguf
MMPROJ=$ORCH_MODELS/google/gemma-4-31B-it-qat-q4_0-gguf/gemma-4-31B-it-mmproj.gguf
MMPROJ_OFFLOAD=on
ALIAS=gemma-4-31b-vision
HOST=127.0.0.1
PORT=8098
GPU_LAYERS=99
THREADS=8
CTX_SIZE=32768
FLASH_ATTN=on
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
TEMP=0.3
TOP_K=64
TOP_P=0.95
REPEAT_PENALTY=1.0
JINJA=yes
EXTRA_ARGS=
