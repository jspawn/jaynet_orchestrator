# Vision helper — Qwen3-VL-8B-Instruct (Apache-2.0), CPU-only like
# embed/rerank, successor to the Qwen2.5-VL-3B helper. Serves the
# local-vision alias: llm.call(images=[...]) routes here for image
# description/OCR when no explicit model is given. Assign it to the
# 'vision' slot in Admin → Models → Presets (Boot model slots); the slot
# ships empty. 8B on CPU is a few seconds per image — the price of never
# evicting a GPU model for a vision call (the GPU-swapped gemma-4-31b
# stays the quality/throughput option). MMPROJ is the multimodal
# projector — without it the server is text-only.
# Download: scripts/pull-model Qwen/Qwen3-VL-8B-Instruct-GGUF
# (ships Q4_K_M + Q8_0 weights and F16 + Q8_0 projectors; a Q8_0-weights
#  variant would be the GPU-served upgrade of this same preset)
MODEL_PATH=$ORCH_MODELS/Qwen/Qwen3-VL-8B-Instruct-GGUF/Qwen3VL-8B-Instruct-Q4_K_M.gguf
MMPROJ=$ORCH_MODELS/Qwen/Qwen3-VL-8B-Instruct-GGUF/mmproj-Qwen3VL-8B-Instruct-F16.gguf
ALIAS=qwen3-vl-8b
HOST=127.0.0.1
PORT=8098
GPU_LAYERS=0
THREADS=8
CTX_SIZE=8192
FLASH_ATTN=off
EXTRA_ARGS=
CACHE_TYPE_K=f16
CACHE_TYPE_V=f16
