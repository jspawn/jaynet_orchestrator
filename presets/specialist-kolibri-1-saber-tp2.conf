# Kolibri-1 specialist on Saber, TWO R9700s (TP=2), text-only, 262K context.
# BF16 attention/embeddings/head, MXFP4 experts and FP8 KV; no draft model.
# Source: /srv/saber-jaynet-dev; native launcher tools/kolibri_serve_native.sh.
# Catalog defaults: port 8002, GPUs 0,1, served_id kolibri-1-saber-tp2;
# caps vision=false/thinking=true; profile think_strip=qwen3, system_first=false,
# tool_selection=auto, sampling temp=1/top_p=.97/top_k=128 (official defaults).
# The template accepts trailing system messages; automatic tools bound cold
# prefill and stay fixed within each run. One request executes at a time.
SERVER=saber
SABER_MODEL=kolibri
SABER_REPO=/srv/saber-jaynet-dev
MODEL_PATH=$ORCH_MODELS/saber-models/saber-packs/kolibri-1-mxfp4-tp2
KOLIBRI_CHECKPOINT=$ORCH_MODELS/saber-models/models/Kolibri-1-BF16
ALIAS=kolibri-1-saber-tp2
HOST=127.0.0.1
PORT=8002
VISIBLE_DEVICES=0,1
CTX_SIZE=262144
MAX_ROWS=256
MAX_NUM_SEQS=1
