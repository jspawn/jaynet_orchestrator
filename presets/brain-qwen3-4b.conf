# Default brain — Qwen3-4B (Apache-2.0), the model scripts/quickstart.sh
# downloads. Runs on CPU or any 8 GB GPU. Swap for a bigger brain in
# admin → Presets when the hardware allows (see docs/models.md).
# Download: scripts/pull-model Qwen/Qwen3-4B-GGUF  (lands at the path below)
MODEL_PATH=$ORCH_MODELS/Qwen/Qwen3-4B-GGUF/Qwen3-4B-Q4_K_M.gguf
ALIAS=qwen3-4b
HOST=127.0.0.1
GPU_LAYERS=99
CTX_SIZE=32768
PREDICT=-1
TEMP=0.7
TOP_K=20
TOP_P=0.8
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=-1
BATCH_SIZE=2048
UBATCH_SIZE=512
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
FLASH_ATTN=on
JINJA=yes
REASONING_FORMAT=
EXTRA_ARGS=
SYSTEM_PROMPT=
TOOLS_TEMPLATE=
SPLIT_MODE=none
TENSOR_SPLIT=
MAIN_GPU=0
VISIBLE_DEVICES=0
