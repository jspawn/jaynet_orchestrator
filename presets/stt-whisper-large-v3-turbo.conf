# Speech-to-text helper — whisper.cpp whisper-server (NOT llama-server),
# CPU-only. Serves audio.transcribe via its multipart /inference endpoint
# (tools.audio.stt_url). WHISPER=on tells start-model.sh to skip all
# llama-server flags and launch the whisper binary instead — register the
# whisper-server binary in Admin → Binaries and pick it on this preset.
# Assign to the 'stt' slot in Admin → Presets (Boot model slots); the slot
# ships empty. Model: ggml-large-v3-turbo (q5_0) from
# huggingface.co/ggerganov/whisper.cpp
WHISPER=on
MODEL_PATH=$ORCH_MODELS/ggml-large-v3-turbo-q5_0.bin
HOST=127.0.0.1
PORT=8099
THREADS=8
EXTRA_ARGS=
