# OSINT specialist — REDCELL 26B-A4B (Gemma 4 MoE SFT by terrorswift,
# Apache-2.0), "osint" tag. Trained for open-source intelligence, cyber
# threat intel and investigative journalism: Admiralty source grading,
# calibrated confidence, passive-first tradecraft. Delegate with
# strength='osint' or swap it onto the specialist slot with
# model.use('<preset>', swap: true); tag the preset 'osint' in admin →
# Presets so strength routing finds it.
#
# NOTE: the first GGUF export (2026-10-09) was broken — doubled token table,
# mislabeled control tokens, <unusedXX> flood. The re-export (2026-10-12)
# with MMAP=off is verified working live (loads, probes clean, measured
# 25.1 GiB VRAM). If generations ever show <unusedXX> again, suspect a
# stale file from the first conversion run.
#
# APEX I-Balanced quant (19.2 GB, imatrix calibrated on the training corpus).
# mmproj enables Gemma 4 vision — image geolocation/chronolocation is core
# OSINT work, so keep it attached. Sampling below is the model card's
# recommended set. Fits ONE 32 GB card at 65536 ctx (weights 20.3 GB +
# q8 KV); raise CTX_SIZE toward the 262144 max only if you have headroom
# or split across two free cards (SPLIT_MODE=tensor, TENSOR_SPLIT=5,5,
# VISIBLE_DEVICES=0,1 — but that collides with the brain's card).
# Download: scripts/pull-model terrorswift/REDCELL-26B-A4B-OSINT-Cyber-APEX-GGUF
# Needs a recent llama.cpp (Gemma 4 support) — scripts/update-helper.sh.
MODEL_PATH=$ORCH_MODELS/terrorswift/REDCELL-26B-A4B-OSINT-Cyber-APEX-GGUF/REDCELL-26B-A4B-OSINT-Cyber-APEX-I-Balanced.gguf
MMPROJ=$ORCH_MODELS/terrorswift/REDCELL-26B-A4B-OSINT-Cyber-APEX-GGUF/mmproj-BF16.gguf
MMPROJ_OFFLOAD=on
ALIAS=redcell-26b-osint
BACKEND=rocm
HOST=127.0.0.1
PORT=8080
GPU_LAYERS=99
CTX_SIZE=65536
# Model card's recommended sampling.
TEMP=0.5
TOP_K=64
TOP_P=0.95
MIN_P=0
REPEAT_PENALTY=1.0
THREADS=-1
BATCH_SIZE=2048
UBATCH_SIZE=512
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
FLASH_ATTN=on
# Model card suggests --no-mmap (weights loaded unmapped — also the ROCm
# slow/hanging-load fix; the launcher picks --load-mode none / --no-mmap).
MMAP=off
JINJA=yes
REASONING_FORMAT=
EXTRA_ARGS=
# The GGUF's embedded chat template is broken (raw special tokens) — force
# the shipped Gemma 4 tools template. Path is relative to the install root.
TOOLS_TEMPLATE=presets/chat_templates/gemma4_tools.jinja
SPLIT_MODE=none
