# Brain candidate: Thinking Machines Inkling 2 Mini, DavidAU Heretic/Turbo
# Brilliance Q8_0 (~27.8 GB), Apache-2.0. Looped 26.4B MoE, 3.4B active
# (5.4B effective with three passes), 128 experts / 8 active per token.
# Current llama.cpp is required for inkling2_loop; tensor split is not
# implemented, and layer split needs an even larger pipeline buffer. Run one
# GPU with one slot and smaller batches to bound the 128K prefill workspace.
# BF16 mmproj enables vision on the CPU; GPU0 has too little free VRAM for it.
# Native context is 1,048,576; use the card-recommended 128K for this initial
# evaluation. Embedded template retained: it includes tools and reasoning modes.
# Card sampling: temp 1.0, top_p .95, top_k 64, min_p .05, no repetition penalty.
# Download: scripts/pull-model DavidAU/Inkling-2-Mini-26B-Heretic-Uncensored-Turbo-Brilliance-50X-V2-AGI-NEO-GGUF
MODEL_PATH=$ORCH_MODELS/DavidAU/Inkling-2-Mini-26B-Heretic-Uncensored-Turbo-Brilliance-50X-V2-AGI-NEO-GGUF/Inkling-2-Mini-26B-Heretic-Uncensored-Turbo-Brilliance-50X-V2-AGI-NEO-Q8_0.gguf
MMPROJ=$ORCH_MODELS/DavidAU/Inkling-2-Mini-26B-Heretic-Uncensored-Turbo-Brilliance-50X-V2-AGI-NEO-GGUF/mmproj-BF16.gguf
MMPROJ_OFFLOAD=off
MEDIA_MARKER=jaynet-brain-vlm
ALIAS=inkling-2-mini-26b-q8
HOST=127.0.0.1
PORT=8090
GPU_LAYERS=99
CTX_SIZE=131072
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
SPLIT_MODE=none
TENSOR_SPLIT=
VISIBLE_DEVICES=0
TEMP=1.0
TOP_K=64
TOP_P=0.95
MIN_P=0.05
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=8
BATCH_SIZE=512
UBATCH_SIZE=128
FLASH_ATTN=on
MMAP=on
MTP=off
JINJA=yes
EMBEDDINGS=off
REASONING_BUDGET=4096
REASONING_EFFORT=high
TOOLS_TEMPLATE=
EXTRA_ARGS=--parallel 1
