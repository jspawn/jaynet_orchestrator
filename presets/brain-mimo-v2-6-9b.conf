# EXAMPLE brain candidate — XiaomiMiMo MiMo-V2.6-Distill-Qwen-9B, Q8_0.
#
# Why this candidate: an agentic SFT on Qwen3.5-9B with unusually strong
# agent numbers for its size (Terminal Bench 2.1: 37.1, Toolathlon: 35.2,
# SWE-Pro: 44.6 — per the MiMo-V2.6 tech report). If tool-calling discipline
# transfers, it is a direct challenger to the Spark-4B routing brain; the
# bakeoff A/B decides. Ships vision (mmproj included below).
#
# qwen35 arch — the same arch the resident Qwen3.8-27B specialist runs on,
# so the current ROCm build covers it. Download: admin → Presets → Download from
# HuggingFace (mradermacher/MiMo-V2.6-Distill-Qwen-9B-GGUF, Q8_0 ≈ 9.5 GB,
# mmproj-f16 ≈ 0.9 GB).
MODEL_PATH=$ORCH_MODELS/mradermacher/MiMo-V2.6-Distill-Qwen-9B-GGUF/MiMo-V2.6-Distill-Qwen-9B.Q8_0.gguf
ALIAS=mimo-v2-6-9b
BACKEND=rocm
HOST=127.0.0.1
PORT=8090
GPU_LAYERS=99
# Same proven topology as the Spark champion: 131072 ctx across both GPUs
# (tensor 5,5), f16 KV, specialist stays resident.
CTX_SIZE=131072
CACHE_TYPE_K=f16
CACHE_TYPE_V=f16
SPLIT_MODE=tensor
TENSOR_SPLIT=5,5
VISIBLE_DEVICES=0,1
MMPROJ=$ORCH_MODELS/mradermacher/MiMo-V2.6-Distill-Qwen-9B-GGUF/MiMo-V2.6-Distill-Qwen-9B.mmproj-f16.gguf
MMPROJ_OFFLOAD=on
# Sampling mirrors the champion baseline; re-run the ladder if it wins.
TEMP=0.75
TOP_K=-1
TOP_P=0.95
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=8
BATCH_SIZE=2048
UBATCH_SIZE=512
FLASH_ATTN=on
MMAP=on
MTP=off
JINJA=yes
EMBEDDINGS=off
REASONING_BUDGET=4096
EXTRA_ARGS=
# Embedded MiMo v2.6 chat template first (the model was SFT'd on it); if
# tool calls misbehave, try presets/chat_templates/qwen3.6_tools.jinja
# (Qwen-family dialect, proven on the specialist).
TOOLS_TEMPLATE=
