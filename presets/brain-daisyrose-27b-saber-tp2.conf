# DaisyRose-27B brain on Saber, TWO R9700s (TP=2), text-only, 262K context.
# Uncalibrated MXFP4 decoder, BF16 embeddings/head and FP8 KV; prefix cache on.
# Source: /srv/saber-jaynet-dev; native launcher tools/serve_daisyrose_native.sh.
# Target-only decode is the validated default; the experimental DFlash2 pack
# stays disabled until its independent quality and JayNet gates pass.
# Catalog defaults: port 8090, GPUs 0,1, served_id daisyrose-27b-saber-tp2;
# caps vision=false/thinking=true; profile think_strip=qwen3, system_first=false,
# tool_selection=auto, sampling temp=1/top_p=.95/top_k=20/min_p=0 (official).
# The fork's compatibility template accepts trailing system anchors, so leave
# agent.anchor.budget enabled. One request executes at a time.
SERVER=saber
SABER_MODEL=daisyrose
SABER_REPO=/srv/saber-jaynet-dev
SABER_BIN=/srv/saber-jaynet-dev/target/release/saber
MODEL_PATH=$ORCH_MODELS/saber-models/saber-packs/daisyrose-27b-mxfp4-tp2-bf16head
DAISY_CHECKPOINT=$ORCH_MODELS/saber-models/models/DaisyRose-27B-BF16
ALIAS=daisyrose-27b-saber-tp2
HOST=127.0.0.1
PORT=8090
VISIBLE_DEVICES=0,1
CTX_SIZE=262144
MAX_NUM_SEQS=1
