# EXAMPLE specialist — Qwen2.5-Coder-32B-Instruct (Apache-2.0), dense.
#
# Why dense for the specialist: every token uses all 32B parameters — slower
# per token than a MoE, but top per-token quality, which is exactly what
# coding delegation (code.delegate) and hard-reasoning spawns pay off on.
# The specialist slot exists so the brain can offload heavy lifting mid-chat
# to a second GPU and hand back when it's done.
#
# Only ONE preset occupies a slot at a time (port + GPU below). To add your
# own specialist (vision, research, domain), clone this file onto the same
# port/GPU and swap with model.use('<preset>', swap: true).
#
# Download: scripts/pull-model Qwen/Qwen2.5-Coder-32B-Instruct-GGUF
# (or admin → Presets → Download from HuggingFace; lands at the path below).
# Needs ~22 GB VRAM at Q4_K_M — smaller quant or fewer GPU_LAYERS otherwise.
MODEL_PATH=$ORCH_MODELS/Qwen/Qwen2.5-Coder-32B-Instruct-GGUF/Qwen2.5-Coder-32B-Instruct-Q4_K_M.gguf
ALIAS=qwen2.5-coder-32b
# Build flavor the author serves with — informational only: start-model.sh
# never reads this; it just shows up in the admin preset info.
BACKEND=rocm
HOST=127.0.0.1
PORT=8080
GPU_LAYERS=99
CTX_SIZE=32768
TEMP=0.2
TOP_K=20
TOP_P=0.8
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=-1
BATCH_SIZE=2048
UBATCH_SIZE=512
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
FLASH_ATTN=on
JINJA=yes
REASONING_FORMAT=
EXTRA_ARGS=
TOOLS_TEMPLATE=
SPLIT_MODE=none
TENSOR_SPLIT=
VISIBLE_DEVICES=1
