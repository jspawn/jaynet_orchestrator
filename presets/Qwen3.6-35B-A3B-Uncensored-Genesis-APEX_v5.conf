# Brain preset — Hermes3.6 V5 APEX. Same build as V4 but WITHOUT the MTP head
# (MTP was buggy in V4); no self-speculative decoding here. v4-MTP stays in
# presets/ as the rollback path.
MODEL_PATH=$ORCH_MODELS/LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-V5-GGUF/Hermes3.6-35B-A3B-Uncensored-Genesis-V5-APEX.gguf
ALIAS=Hermes3.6-35B-A3B-uncens-genesis-V5-APEX
MMPROJ=$ORCH_MODELS/LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-V5-GGUF/mmproj-Hermes3.6-35B-A3B-Uncensored-Genesis-F16.gguf
MMPROJ_OFFLOAD=on
MTP=off
BACKEND=rocm
HOST=127.0.0.1
#PORT=8091
GPU_LAYERS=99
CTX_SIZE=262144
TEMP=0.6
TOP_K=20
TOP_P=0.95
MIN_P=0
PRESENCE_PENALTY=0
REPEAT_PENALTY=1.0
THREADS=-1
BATCH_SIZE=2048
UBATCH_SIZE=512
# KV quant: q8_0 (not f16) — halves KV VRAM at 256k ctx, matching the
# specialist slot; the headroom is what keeps GPU0 out of OOM territory.
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
FLASH_ATTN=on
JINJA=yes
REASONING_FORMAT=
EXTRA_ARGS=
TOOLS_TEMPLATE=$ORCH_MODELS/chat_templates/qwen3.6_tools.jinja
SPLIT_MODE=none
TENSOR_SPLIT=
VISIBLE_DEVICES=0
