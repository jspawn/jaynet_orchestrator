# EXAMPLE encoder — Qwen3-8B pooling server for the CLM sidecar (plugins/clm).
#
# NOT a chat model: clm-serve needs OpenAI-compatible /v1/embeddings with
# last-token pooling from exactly THIS encoder (the CLM heads are
# encoder-locked — Qwen3-Embedding-8B or any other model will not work).
#
# Why a separate server: the RAG embed slot (Qwen3-Embedding-8B) stays
# untouched; this one serves only CLM states/actions at 2048 ctx.
# Download: admin → Presets → Download from HuggingFace
# (Qwen/Qwen3-8B-GGUF, Q4_K_M ≈ 5 GB).
# Live note 2026-09-27: runs the Q8_0 pull (/srv/models/czl/CLM-v0.1-8B-GGUF)
# on CPU — 8.7 GB does not fit the free VRAM beside the resident
# brain+specialist, and warm CPU latency measured ~0.3 s per decision
# (states are ≤2k tokens and clm-serve caches state/action vectors, so most
# calls skip the encoder entirely). For the route_request HOOK (2 s budget
# on the per-request path) switch to the Q4_K_M quant + GPU (BACKEND=rocm,
# GPU_LAYERS=99) — or keep CPU and accept silent keyword fallback on slow
# calls.
MODEL_PATH=$ORCH_MODELS/czl/CLM-v0.1-8B-GGUF/Qwen3-8B-Q8_0.gguf
ALIAS=qwen3-8b
BACKEND=cpu
HOST=127.0.0.1
PORT=8094
GPU_LAYERS=0
CTX_SIZE=2048
EMBEDDINGS=on
POOLING=last
JINJA=no
FLASH_ATTN=off
CACHE_TYPE_K=f16
CACHE_TYPE_V=f16
THREADS=16
EXTRA_ARGS=
