# Vision helper — Qwen2.5-VL-3B-Instruct (Apache-2.0), CPU-only like
# embed/rerank. Serves the local-vision alias: llm.call(images=[...]) routes
# here for image description/OCR when no explicit model is given. Assign it
# to the 'vision' slot in Admin → Presets (Boot model slots); the slot ships
# empty. MMPROJ is the multimodal projector — without it the server is
# text-only. Download: scripts/pull-model <a Qwen2.5-VL-3B GGUF + mmproj>
MODEL_PATH=$ORCH_MODELS/Qwen2.5-VL-3B-Instruct-Q8_0.gguf
MMPROJ=$ORCH_MODELS/Qwen2.5-VL-3B-mmproj-f16.gguf
ALIAS=qwen2.5-vl-3b
HOST=127.0.0.1
PORT=8098
GPU_LAYERS=0
THREADS=8
CTX_SIZE=8192
FLASH_ATTN=off
EXTRA_ARGS=
CACHE_TYPE_K=f16
CACHE_TYPE_V=f16
