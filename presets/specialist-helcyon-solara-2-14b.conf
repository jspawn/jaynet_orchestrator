# EXAMPLE specialist — Helcyon Solara 2 14B (Apache-2.0), "chatting" tag.
#
# Why a chatting specialist: the brain routes and the coder builds, but
# neither is tuned for a good CONVERSATION — companion chat, roleplay,
# creative back-and-forth, personal reflection. Solara (Ministral 3 14B base,
# XeyonAI Series 7) is fine-tuned exactly for that lane. Delegate with
# strength='chatting' or swap it onto the specialist slot with
# model.use('<preset>', swap: true); tag the preset 'chatting' in admin →
# Presets so strength routing finds it.
#
# Download: admin → Presets → Download from HuggingFace
# (XeyonAI/Helcyon-Solara-2-14b-v2.0-GGUF, Q8_0 ≈ 15 GB — fits one GPU).
# Needs a RECENT llama.cpp build (Ministral 3 support) — scripts/update-helper.sh.
# Vision-capable per the card, but only with the matching mmproj file
# (not downloaded — add MMPROJ= when you have it).
MODEL_PATH=$ORCH_MODELS/XeyonAI/Helcyon-Solara-2-14b-v2.0-GGUF/Helcyon-Solara-2-14B-v2.0-Q8_0.gguf
ALIAS=helcyon-solara-2-14b
BACKEND=rocm
HOST=127.0.0.1
PORT=8080
GPU_LAYERS=99
CTX_SIZE=65536
# Sampling straight from the model card's recommended settings (Ministral
# fine-tunes are sampler-sensitive — start here, tweak after, not before).
TEMP=0.45
TOP_K=0
TOP_P=1.0
MIN_P=0.035
PRESENCE_PENALTY=0.2
REPEAT_PENALTY=1.05
THREADS=-1
BATCH_SIZE=2048
UBATCH_SIZE=512
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
FLASH_ATTN=on
JINJA=yes
REASONING_FORMAT=
# DRY repetition penalty per the card (not a first-class conf field).
EXTRA_ARGS=--dry-multiplier 0.8 --dry-base 2 --dry-allowed-length 2 --dry-penalty-last-n 8192
TOOLS_TEMPLATE=
SPLIT_MODE=tensor
TENSOR_SPLIT=5,5
VISIBLE_DEVICES=0,1
