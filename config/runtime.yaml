# Orchestrator runtime config

orchestrator:
  # The model that drives the reasoning loop. Reaches LiteLLM at :4000.
  model: local-orchestrator
  litellm_base: http://127.0.0.1:4000
  # Max concurrent in-flight model calls per backend alias. This is a CAP,
  # not a multiplier: single-chat runs still fire one call at a time — the
  # headroom only gets used by fan-out children, parallel tool turns, and
  # eval/bench runs. Match each local alias to its server's slot count
  # (llama-server -np, default 4 on current builds with a unified KV cache);
  # firing more than the server has slots serializes at the server and burns
  # each queued request's timeout, so on older/single-slot servers lower the
  # value to match. Brain and specialist are separate cards and overlap
  # freely; cloud aliases are intentionally omitted → unbounded (that
  # parallelism runs off-box). Embed/rerank servers are NOT covered here —
  # RAG calls them directly (not via LiteLLM aliases) and batch internally.
  # The keys here also double as the set of local aliases WITHOUT a local- prefix
  # (e.g. a serve.start'd model under a custom alias) for the jinja thinking
  # switch — chat_template_kwargs is only sent to these and local-* aliases.
  local_concurrency:
    local-orchestrator: 4   # llama-server default: n_slots=4, kv_unified
    local-specialist: 4
  # Hard cap for ONE model turn (seconds). At ~40 tok/s local speed a legitimately
  # long generation (big diff, long report) needs many minutes — 900s ≈ 36k tokens —
  # so this is a hang backstop, not a pacing limit. On expiry the run ends
  # gracefully as "stalled" (partial work preserved), not as an internal error.
  turn_timeout_s: 900
  # Adaptive thinking: runs the tool selector scores "trivial" (short request, no
  # tool keywords — conversational) force think=off, skipping chain-of-thought to
  # save prefill + first-token latency. Only downgrades think=true→false; the UI
  # toggle and voice (think=false) are unaffected. false = honor `think` as-is.
  adaptive_thinking: true
  # Served context size of the brain in tokens — keep in sync with the preset's
  # CTX_SIZE. Feeds ONLY the context-pressure guard: when a turn's prompt
  # reaches budgets.warn_fraction of this, the model gets a one-time "wrap up,
  # checkpoint, don't re-read big files" nudge instead of the run dying on a
  # server 400 when the window actually fills. 0/null disables the guard.
  context_tokens: 262144
  # Server-side cap on replayed chat history (user/assistant messages). The
  # web UI replays the whole chat with each message, and every replayed turn
  # is re-sent on every model turn of the run — cap it so long chats don't
  # grow each run's prefill unbounded. Older turns are silently dropped (the
  # kept assistant turns still carry their trajectory notes). 0 = unlimited.
  max_history_messages: 40
  # System prompt file (relative to JAYNET_HOME)
  system_prompt: prompts/orchestrator-gate.md    # slim gate prompt (~1.4k tok)
  # Timezone for the datetime injected into the system prompt. null = system tz.
  # A user's per-account setting (account page → Timezone) overrides this.
  # Examples: Europe/Zurich, UTC, America/New_York
  timezone: Europe/Zurich
  # User location injected into the system prompt; the model assumes it for
  # local/travel/nearby/weather/price queries. null = model asks instead.
  location: Zürich, Switzerland
  # Optional: path to the preset (start-model.sh format) currently serving the
  # brain. If set, the orchestrator reads the served model + whether a vision
  # projector (MMPROJ) is loaded, and forwards image attachments to the brain
  # only when it is. The orchestrator still calls the brain via the LiteLLM
  # alias above.
  brain_preset: null            # e.g. /srv/llama/presets/qwen3-6-35b-vision.conf
                                # (env JAYNET_BRAIN_PRESET overrides this)
  # Sampler defaults sent per request to the model (via LiteLLM -> llama-server).
  # These are PER-REQUEST, so the web console can override them for a single run
  # without restarting anything. Only set keys you want to send; omit/null to let
  # the server use its own preset default. Load-time things (ctx size, KV quant,
  # which model is loaded) still require a relaunch and are NOT here.
  sampling:
    temperature: 0.7            # Qwen thinking-mode range is 0.6-0.7; lower values
                                # narrow the reasoning path and hurt answer quality
    top_p: null                 # e.g. 0.95
    top_k: null                 # e.g. 40
    min_p: null
    repeat_penalty: null        # e.g. 1.1
    presence_penalty: null
    frequency_penalty: null
    seed: null                  # set an int for reproducible sampling
    # Hard cap on ONE turn's completion (brain only). Guards against a rambling
    # or looping generation burning the whole 900s turn timeout. Trade-off: a
    # single huge tool call (e.g. fs.write of a very large file) is truncated
    # mid-JSON at the cap and must be retried in smaller chunks — it surfaces
    # as an invalid-JSON tool error, not a hang. Thinking tokens count toward
    # the cap too: an uncapped thinker can return an EMPTY answer at the cap
    # (the loop nudges once for a brief reply) — REASONING_BUDGET in the brain
    # preset caps thinking separately so answer room is always reserved.
    max_tokens: 8192
  # Vision capability: null = auto-detect from brain_preset; true/false = force.
  vision: null

# Default budgets per request. Caller can override via CLI/API.
budgets:
  max_iterations: 60            # research + multi-step API tasks need headroom
  # Wall-clock ceiling — 0 = DISABLED. Local-first: the brain generates ~40 tok/s,
  # so honest work is slow and a wall-clock ceiling was hard-cutting healthy long
  # runs. Local runs are protected by stall_s (hung backend), max_iterations and
  # max_total_tokens (runaway loops) instead. The cost ceiling below stays the
  # binding constraint for cloud aliases (local models bill $0 anyway).
  max_wall_clock_s: 0
  # Liveness extensions (0/0 = off for chats — the admin budget stays
  # absolute). When enabled, an expiring wall clock extends by grace_s while
  # the run is still cycling (each loop iteration is a "ping"); a hung turn
  # never pings and dies by the stall watchdog instead. Used by eval runs.
  wall_clock_grace_s: 0
  wall_clock_max_extensions: 0
  # Stall watchdog (seconds): a STREAMING model turn stalls when no SSE line
  # arrives for this long, OR when only keepalive/empty traffic arrives with no
  # content/tool-call delta — both mean a hung (zombie) backend, and keepalives
  # must not mask it. The turn aborts and the run ends gracefully as "stalled"
  # with partial work preserved. Never applies during tool execution: a
  # code.delegate child can run many silent minutes legitimately.
  stall_s: 180
  max_cost_usd: 1.00
  max_total_tokens: 1000000      # cumulative prompt+completion across the run (not the
                                # 65k ctx window — that's enforced per-turn by llama-server).
                                # ~= max_iterations x (ctx/2): a backstop for runaway loops,
                                # so iterations/cost are the usual binding limits.
  # Weight applied to CACHED prompt tokens in the ceiling above. Prefix-cache hits
  # (llama.cpp reuses the KV; cloud bills them ~10%) are near-free, and in long
  # tool loops >90% of prompt tokens are cache hits — full-weight counting was
  # killing healthy runs on re-transmission, not real work. 0.1 matches the cost
  # path; 1.0 restores the old full-weight behaviour; 0 makes cache hits free.
  cached_token_weight: 0.1
  warn_fraction: 0.8            # at this fraction of ANY ceiling, inject a one-time nudge
                                # telling the model to checkpoint (save + NEXT_STEPS.md) and
                                # wrap up gracefully rather than getting hard-cut. 0 disables.

# Loop-guard escalation. The duplicate-call guard (same tool+args 3× with no
# intervening write) refuses the call — but a stubborn model can keep
# re-emitting it, or hop between trivial query variants, burning every
# remaining iteration on polite refusals. After this many guard refusals in
# ONE run, the next model turn runs with tools DISABLED to force the final
# answer; if the model still tries tools, the run ends as "stuck". 0 disables.
loop_guard:
  max_rejections: 6
  # Near-duplicate guard: the exact-args check misses reworded repeats — the
  # same search with shuffled words ("price 2026 CHF" → "24h price CHF 2026"),
  # the classic overthinking loop. For the listed query-like tools, two calls
  # whose argument tokens overlap ≥ near_dup_threshold (Jaccard) count as
  # duplicates: two similar calls pass (refinement), the third is blocked with
  # a synthesize-now error and counts toward max_rejections. Different
  # queries score far below the threshold and pass freely; very short
  # same-host URLs can look alike (tokens <3 chars are dropped) — if the
  # guard ever bites distinct fetches, raise the threshold. 0 disables.
  near_dup_threshold: 0.75
  near_dup_tools: [web.search, web.fetch, arxiv.search]
  # Crash/failure-loop escalation: execution tools report command failures in
  # their payload (ok:false / exit_code!=0), not as tool errors — the duplicate
  # guards above never see a crash-retry loop (e.g. a segfaulting solver rebuilt
  # over and over). After failure_nudge_after CONSECUTIVE failures with the same
  # error signature (tool + exit code + normalized stderr tail), the tool result
  # gets a strategy-change hint appended (switch approach, or code.delegate to
  # the specialist when available). Success or a different error resets the
  # count. 0 disables.
  failure_nudge_after: 3
  failure_nudge_tools: [code.run, code.execute]
  # Delegate gate: the brain's prompt tells it to hand non-trivial coding to
  # code.delegate (specialist model, bulky transcript stays in the child),
  # but small MoE brains implement inline anyway — live eval: 17 inline
  # edits, 0 delegations. After delegate_nudge_after successful inline
  # fs.write/fs.edit/code.patch calls without a code.delegate, the tool
  # result carries a directive to delegate. With delegate_enforce, inline
  # edits are REJECTED from the threshold on — 1 + enforce = delegate
  # first, literally. Any code.delegate call disarms the gate (verify-fix
  # loops after the child's report stay legitimate). The gate only engages
  # when delegation would actually route somewhere stronger (configured
  # coder alias or a live coding-strength specialist); single-model
  # installs and runs without code.delegate are never touched. 0 disables.
  delegate_nudge_after: 3
  delegate_enforce: false

# /goal — a user-bound objective the orchestrator pursues across MULTIPLE runs
# (web/goals.py drives one turn per run until the model declares completion).
# These ceilings span the whole goal, not one run: they are the hard stop for
# an unattended loop that re-launches itself.
goal:
  max_turns: 10               # runs per goal
  max_total_tokens: 2000000   # effective tokens, summed over all turns
  max_wall_clock_s: 3600      # 0 = no wall-clock ceiling
  judge: true                 # a tool-free brain call double-checks a
                              # self-declared completion before accepting it
  check_timeout_s: 120        # timeout for a | check: completion command
                              # (deterministic gate — replaces the judge);
                              # 0/unset = 120 — there is no unbounded mode

# Watchdog (run coroner, web/watchdog.py). A run ending stuck/error/stalled —
# or any non-ok end after heavy loop-guard churn — gets an automatic local
# post-mortem in the admin area (Reports, next to flagged sessions). One
# tool-free brain call per report, one report per run, read-only.
watchdog:
  enabled: true
  min_guard_rejections: 8     # churn trigger for runs that didn't hard-fail
  max_per_day: 20             # fleet-wide cap; 0 = unlimited

# Eval harness (runtime/eval_runner.py) — behavioural test suites driven
# through the real agent loop (cases in evals/ + the Studio custom layer),
# graded by a judge model. Budgets: $ per case/suite, plus a per-turn wall
# clock (iteration/token ceilings stay disabled). Results + gated improvement
# proposals land in eval.db; admin area has the Eval tab.
eval:
  enabled: true
  max_cost_usd: 0.50          # per test case (harness turns + judge + driver)
  suite_max_cost_usd: 2.00    # per bulk run (eval.run with a tag)
  benchmark_max_cost_usd: 10.00  # across ALL suites of one benchmark run
  judge_model: glm-5.2        # grades transcripts; falls back to local-specialist
  driver_model: glm-5.2       # adaptive driver (writes follow-up probes)
  adaptive_max_turns: 6       # per adaptive scenario
  judge_temperature: 0.0      # benchmark trends must not wobble
  turn_wall_clock_s: 1800     # per case turn; 0 = unlimited. The $ cap can't
                              # fire on $0.00 local brains — without this a
                              # stuck case loops forever and blocks the suite.
  wall_clock_grace_s: 120     # liveness ping: an expiring wall clock extends
                              # by this while the run is still cycling (a
                              # zombie never reaches the ping — it hangs
                              # inside a turn and dies by the stall watchdog)
  wall_clock_max_extensions: 5  # up to +10 min per case turn

# In-chat correction capture (runtime/reflect.py) — the "reflect" path.
# Explicit corrections in SUCCESSFUL sessions ("no, use uv instead of pip")
# never reach the flag/eval improvement loop; this catches them: a lexical
# pre-gate, then a LOCAL-model verdict (chat content never leaves the box),
# then a dedup'd proposal in Admin → Eval → Proposals. Nothing auto-applies.
reflect:
  enabled: true
  max_message_chars: 800      # corrections are short; longer messages skip
                              # the pre-gate (also bounds the analysis call)

# Sub-agents (agent.spawn). A nested run inherits the parent's confirmation flow
# and can only narrow the parent's tool set; its spend counts against the parent.
agent:
  max_depth: 2                  # how deep spawning may nest (parent=0)
  default_sub_iterations: 8     # child max_iterations when not specified
  # Deliverable check: at the final answer, files the task (or the answer)
  # NAMED but that don't exist in the workspace are almost always unwritten
  # deliverables — the top small-brain failure mode (solved the task, never
  # called fs.write; ~half of tb eval failures). One nudge per run sends the
  # agent back to write them before its answer is accepted. warn_at adds a
  # mid-run reminder at that fraction of the iteration budget (0 disables) —
  # the final-answer check comes too late when the last iterations are spent
  # still computing (live: tb-count-dataset-tokens).
  deliverable_check:
    enabled: true
    warn_at: 0.75
  # Stall ladder: the frozen-brain pattern (read a few files, then stop
  # without producing anything) shows up as consecutive turns with no
  # mutation — only reads/searches. Every `after` no-progress turns one
  # directive is injected (3 rungs, once per run each): act now → dumbest
  # version/delegate/ask → produce-or-ask. Turns spent polling a running
  # job are neutral (neither count nor reset); any real change resets.
  stall_check:
    enabled: true
    after: 2                    # no-progress turns between rungs; 0 disables
  # Strength gate (enforce-mode routing): the routing nudge ASKS the brain to
  # delegate strength-domain work; small MoEs still don't (live: 5/5 security
  # cases stayed on the default brain, one outright refusal). When the request
  # matches routing_nudge.strength_keywords for a tag with a live OR swappable
  # route (a stopped LOCAL preset carrying the tag counts — code.delegate
  # swaps it onto its slot automatically, e.g. dolphin for security), inline
  # implementation tools (fs.write/fs.edit/code.patch) are REJECTED until the
  # first code.delegate call — which disarms the gate. Never fires without a
  # route, so single-model installs are untouched.
  strength_gate:
    enabled: true
  # Procedure auto-selector: skills with a `shape:` frontmatter tag are
  # PROCEDURES — distilled step-by-steps for a task shape. The catalog asks
  # the model to skill.load on a match; small brains rarely do, so a
  # confident keyword match loads the body for them at run start (one per
  # run, brain-only, visible as a procedure_autoload event). Keyword sets
  # are deliberately narrow — a false positive injects a multi-thousand
  # token body for the whole run.
  procedure_selector:
    enabled: true
    # shape tag -> keywords implying that task shape
    shapes:
      implement-from-spec: ["implement the", "research paper",
                            "from the paper", "from scratch",
                            "passes the test", "write /app", "create /app",
                            "convert the"]
      debug-and-fix: ["failing test", "tests fail", "test fails",
                      "fix the bug", "debug the", "broken build",
                      "fix the failing", "bug in the"]
      research-and-verify: ["find the official", "official codebase",
                            "official repo", "official implementation",
                            "look up the", "find the source"]
  # Plan-first "architect" flow for complex requests. The brain rates each
  # request 1-4 and, at/above `threshold`, calls the architect tool (plan →
  # specialist pokes holes → cloud arbiter only on disagreement → HANDOFF.md → fresh
  # execution). Users can override the threshold in Account → Settings; 0 disables.
  # (defined as its own top-level block below)
  # Working anchor: the goal restated + your note.set note, re-injected each turn
  # so long runs don't lose the thread under compaction. Placement:
  #   "off"      – disabled (default). note.set still works: the note stays in
  #                the transcript as a small tool call and survives compaction,
  #                it is just not re-pinned to every turn. The plain, known-good
  #                transcript — use this if your chat template is strict.
  #   "system"   – folded into the system message: safe on ANY template, but
  #                re-prefills the prompt each turn (small cost on long runs).
  #   "trailing" – appended as a trailing system message: cheap (keeps the prompt
  #                cache) but needs a template that accepts a system message last.
  anchor:
    mode: "off"
    # Where the live todo list (todos tool) is re-injected each turn when the
    # anchor above is off — the list is the agent's plan, so it gets compaction
    # protection even on the plain transcript. Same placement tradeoffs:
    #   "trailing" – default: own trailing system message, cheap, but needs a
    #                template that accepts a system message last (the shipped
    #                qwen3.6 template does).
    #   "system"   – folded into the position-0 system message: safe on ANY
    #                template, costs a re-prefill per turn.
    #   "off"      – no re-injection: the list lives only in the transcript
    #                and the ToDos panel (no compaction survival).
    # When anchor.mode is on, the list always rides inside the anchor instead.
    todos_reinject: "trailing"
  # Verifier gate for spawned agents that pass a `verify` check (agent.spawn /
  # code.delegate). The child isn't "done" until the check exits 0; on failure it
  # iterates on the output (bounded by max_checks and its budget), and it may not
  # edit the protected test/check files to force a pass. Defaults below fill in
  # anything the spawn call's verify spec omits.
  verify:
    max_checks: 4               # verify attempts before the run returns "unverified"
    stall_after: 2              # stop early if the SAME failure recurs this many times
    timeout_s: 180              # per-check wall-clock cap for the command
    protect:                    # files the agent must not change to pass
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/tests/**/*.py"
      - "**/conftest.py"
  # Default budget for spawned sub-agents (agent.spawn) when the spawn call passes no
  # `budget` of its own — the analog of tools.code.delegate.budget. A per-call `budget`
  # overrides these; every dimension is still CLAMPED to the parent's REMAINING
  # allowance, so a child can never out-spend its parent. Any dimension left unset
  # falls back to the parent's remaining allowance (cost/tokens/wall) or, for
  # iterations, to default_sub_iterations above. Uncomment to set fleet-wide defaults:
  default_budget:
    # max_iterations: 8         # takes precedence over default_sub_iterations when set
    # max_total_tokens: 200000
    # max_wall_clock_s: 120
    # max_cost_usd: 0.50

# Runtime-loadable skills (skill.load / skill.list). Each subdir of `dir` with a
# SKILL.md is a skill; its name+description are injected into the system prompt.
# Admin-Studio creations live in $JAYNET_DATA/custom/skills and are layered on top
# (custom wins on name clash); same for chains ($JAYNET_DATA/custom/chains).
skills:
  dir: skills                            # relative to JAYNET_HOME

# Chains (chain.list / chain.run) — named, reusable multi-step pipelines.
# Each <name>.yaml in `dir` is a chain: sequential steps of sub-agents
# (`agent:`) and stateless local prompt calls (`prompt:`), wired with
# {{input}} / {{steps.<id>.output}} placeholders. See chains/research-brief.yaml.
chains:
  dir: chains                            # relative to JAYNET_HOME

# Tool exposure strategy. Decided ONCE per request and frozen for the run, so
# the tool-schema prefix stays prompt-cache-stable (see guide §3.7). Bounded
# exception: tools.load (always core) lets the model pull in more categories
# mid-run when the keyword guess missed — capped by max_expansions.
#   all    - expose every tool every turn (default; zero behaviour change)
#   static - expose only the caller's --tools allowlist (else all)
#   auto   - core_namespaces + any namespace whose keyword appears in the message
# Transcript compaction. The loop re-sends the WHOLE conversation each turn, so a
# big tool result (a file read, a long diff) keeps costing full tokens for the rest
# of the run. When enabled, old + large tool-result messages are shrunk in place to
# a short stub (status + head snippet + a pointer to trace.query) once they're past
# the most recent `keep_last`. System/user/assistant messages are never touched.
# Enabled below, batched to every 3rd iteration so prompt-cache breaks amortize.
models:
  # SQLite preset catalog: the admin Presets tab edits the DB, not this file.
  # The presets: below are the FACTORY SEED — imported into the DB on first
  # use; afterwards the DB wins and edits here have no effect (delete the DB
  # to re-seed). Materialized .conf copies land next to it in presets/.
  presets_db: presets.db      # relative to JAYNET_DATA
  # Curated preset catalog. Each preset serves onto a FIXED `port` that matches a
  # static entry in litellm.yaml, so model.use needs no runtime registration (works
  # on the stateless proxy). `served_id` is the model id llama-server reports (the
  # part after openai/ in litellm.yaml) — used to detect a wrong-model-on-the-slot.
  # `gpu` = device placement: a single id ("0"), a comma list ("0,1" = layer-
  # split across those cards), "" = CPU-only. Ids must exist in models.gpus.
  # `binary` = which llama-server build launches it (a models.binaries name;
  # omit for the default). Editable in admin → Presets.
  # A preset with `remote_host` adopts a server that is ALREADY RUNNING (any
  # OpenAI-compatible one: llama-server, vLLM, Ollama) — JayNet only health-
  # probes it, never launches/stops it. Value: bare host (port from `port`) or
  # a full URL (http://vllm-box:8000, http://ollama-box:11434). Optional:
  # `backend` (llama/vllm/ollama/openai) + `caps` ({vision: …, thinking: …})
  # for the things probing can't detect. See docs/models.md.
  # Example:
  #   attic:
  #     preset: ""          # no .conf — JayNet never launches it
  #     role: adopted vLLM box in the attic
  #     alias: local-specialist
  #     remote_host: http://192.168.1.50:8000
  #     backend: vllm
  #     served_id: Qwen/Qwen3-32B
  #     caps: {thinking: false}
  # Strength tags: what a preset `strengths:` tag MEANS, in one line. Tags stay
  # free-form, but registered tags get their description shown in the system
  # prompt (so the brain knows what to ask for) and in admin → Presets — and
  # delegation routes by them (code.delegate / agent.spawn strength="...").
  # 'allround' is the built-in catch-all fallback and needs no entry.
  strengths:
    coding: "code synthesis, debugging, refactors, test fixing"
    research: "literature and web research, analysis, synthesis"
    reasoning: "math, logic, planning, tricky deduction"
    security: "security research, exploit analysis, pentesting"
    vision: "image understanding"
  presets:
    brain:                              # default brain (GPU 0 :8090, works on CPU)
      preset: presets/brain-qwen3-4b.conf   # relative to JAYNET_HOME
      role: default brain (Qwen3-4B, Apache-2.0) - the orchestrator driver; swap for a bigger model in admin → Presets
      alias: local-orchestrator
      port: 8090
      gpu: "0"
      served_id: qwen3-4b
      vram_gib: 4
      strengths: [reasoning, orchestration]
    # Bigger brain? See the `brain-moe` example below: same slot (port+gpu),
    # so model.use('brain-moe', swap: true) switches — or set the boot
    # assignment in admin → Presets → Model slots.
    # --- Slot idea: presets sharing a port+gpu are alternatives for the SAME
    #     slot; only one runs at a time. The two examples below teach the
    #     classic two-GPU layout — a fast MoE brain + a dense specialist the
    #     brain delegates heavy lifting to (code.delegate / agent.spawn). ---
    brain-moe:                          # EXAMPLE brain upgrade (MoE) — same slot as `brain`
      preset: presets/brain-qwen3-30b-a3b-moe.conf
      role: example MoE brain (Qwen3-30B-A3B, Apache-2.0) - ~3B active params = small-model speed, big-model knowledge; the all-day brain once you have a 24 GB card
      alias: local-orchestrator
      port: 8090
      gpu: "0"
      served_id: qwen3-30b-a3b
      vram_gib: 20
      strengths: [reasoning, orchestration]
    specialist:                         # EXAMPLE dense specialist — the GPU-1 workhorse
      preset: presets/specialist-qwen2.5-coder-32b-dense.conf
      role: example dense specialist (Qwen2.5-Coder-32B, Apache-2.0) - slower per token than MoE but stronger per token; the code.delegate target
      alias: local-specialist
      port: 8080
      gpu: "1"
      served_id: qwen2.5-coder-32b
      vram_gib: 22
      strengths: [coding, reasoning]
    # Your own specialists go here (vision/research/domain models): alias
    # local-specialist, port 8080, gpu "1" — swap in with model.use.
    # --- CPU-only RAG services (no GPU, system RAM only) ---
    embed:
      preset: presets/embed-qwen3-0.6b.conf   # relative to JAYNET_HOME
      role: default RAG embedding server (CPU-only, Qwen3-Embedding-0.6B, Apache-2.0)
      port: 8095
      gpu: ""              # "" = CPU-only, "0"/"1" = that card, "0,1" = split
      served_id: qwen3-embedding-0.6b
      vram_gib: 0
    # Bigger embedder? Qwen3-Embedding-8B (Q8_0, ~9 GB) is the quality upgrade —
    # same port, same pattern: clone the conf, bump CTX/ALIAS, swap the slot.
    rerank:
      preset: presets/rerank-qwen3-0.6b.conf   # relative to JAYNET_HOME
      role: RAG reranker server (CPU-only, Qwen3-Reranker-0.6B Q8_0)
      port: 8096
      gpu: ""
      served_id: qwen3-reranker-0.6b
      vram_gib: 0
  # GPU topology: the cards presets can be placed on — any count, mixed vendors.
  # SEED only (imported into the preset DB on first use); afterwards edit in
  # admin → Presets → GPUs. gpu_info is optional display metadata for that UI.
  gpus: ["0", "1"]
  # gpu_info:
  #   "0": {label: RX 7900 XTX, vram_gib: 24}
  #   "1": {label: RX 7800 XT,  vram_gib: 16}
  # llama-server binaries: named builds a preset can launch with (`binary:` per
  # preset, "" = LLAMA_BIN / built-in default). SEED only like gpus — afterwards
  # edit in admin → Presets → Binaries. device_env is the card-pinning variable
  # the build understands. One process = one backend: to split ONE model across
  # mixed-vendor cards, build llama.cpp with Vulkan and point the preset at it.
  # Examples:
  #   rocm:   {path: /opt/llama.cpp-rocm/build/bin/llama-server,   device_env: HIP_VISIBLE_DEVICES}
  #   vulkan: {path: /opt/llama.cpp-vulkan/build/bin/llama-server, device_env: GGML_VK_VISIBLE_DEVICES}
  #   cuda:   {path: /opt/llama.cpp-cuda/build/bin/llama-server,   device_env: CUDA_VISIBLE_DEVICES}
  binaries: {}
  # Default layout: brain on GPU 0, one specialist on GPU 1 — but placement is
  # per-preset (`gpu:` above / admin → Presets), e.g. brain on "0,1" + specialist
  # on CPU. (no parallel-brain - it wasn't paying off).
  default_posture: brain+specialist
  # Served at STARTUP via model.use (serve-managed, so model.use can swap the GPU-1
  # slot without a systemctl stop). Requires the web startup hook; the process
  # manager (processes: below) must not launch the same slot too.
  boot: null

architect:
  threshold: 4              # complexity bar on a 1-4 scale (4=complex); per-run override in Account → Settings; 0=off
  reviewer_model: local-specialist  # pokes holes in the plan
  arbiter_model: kimi         # decides only when the reviewer fundamentally disagrees
  per_unit_verify: true       # execute UNITS one spawn each, harness-gated on the
                            # unit's `| check:` command (stops at the first failed
                            # unit). Only applies when EVERY unit has a check;
                            # otherwise one executor runs the plan as before.
  # verify: "pytest -q"      # optional done-check the executor stage is gated on

compaction:
  enabled: true
  max_result_chars: 2000     # only tool results larger than this are stubbed
  keep_last: 3               # never compact the N most recent tool results
                             # (salience: results the agent context.pin's are also kept)
  every: 3                   # run the pass every Nth loop iteration, not every
                             # one: each pass that stubs breaks the prompt-cache
                             # prefix there, so batching stubs amortizes the
                             # re-prefill over N turns

# Parallel tool execution. Gating (loop-guard, privacy, confirmation) is always
# sequential; only the actual execution of already-approved calls in a single turn
# is run concurrently (asyncio.gather). Helps when the model emits several
# independent IO-bound calls at once (e.g. lint.run + code.symbols + git.status).
# Default OFF; order of results in the transcript is preserved either way.
parallel_tools:
  enabled: true

tool_selection:
  mode: auto
  # Core tools shipped on every turn (~15 tools, ~4k tok).
  # Everything else is keyword-triggered, keeping simple Q&A fast.
  core_namespaces:
    # Exact tool names (not just namespaces) are supported here:
    - web.search
    - web.fetch
    - ask.user
    - skill.load
    - note.set
    - todos                        # visible step-by-step plan (ToDos side panel)
    - run.badge                    # short live status label on the run (skill modes)
    - context.pin
    - deliver.files
    - memory.search
    - memory.get
    - fs.list
    - fs.read
    - fs.find
    - gpu.status
    - llm.call
    - agent.spawn
    - tools.load                     # mid-run escape hatch: pull in more categories
  # Cap on mid-run toolset expansions via tools.load. Each expansion rebuilds
  # the tool schema and busts the prompt-cache prefix once, so keep it small.
  max_expansions: 2
  # Routing nudge: when the request smells like routed work (coding, or a
  # registered strength domain), inject a one-line "route this, don't do it
  # inline" system note right before the user turn. Deterministic (keywords,
  # no LLM call) — backs up the gate prompt's standing Route-don't-do rule,
  # which small brains follow unreliably. Keyword sets here are deliberately
  # narrower than keyword_namespaces: a false positive only wastes a line,
  # but it must not talk the brain out of answering a non-coding question.
  routing_nudge:
    enabled: true
    code_keywords: [implement, refactor, debug, compile, traceback, pytest,
                    "write a function", "write a script", "shell script",
                    "source code", "code review", "fix this code", "patch the",
                    "unit test"]
    # tag -> keywords implying that strength domain (tags from models.strengths;
    # presets carry them in `strengths:`). Hit + live holder → the note names
    # the model; hit + no live holder → the note says to model.use it in first.
    strength_keywords:
      security: [vulnerability, vuln, exploit, pentest, "pen test", cve,
                 "sql injection", xss, "privilege escalation", malware,
                 forensic, "security audit", rce, "reverse shell", intrusion,
                 "incident response", "security threat", "threat detection",
                 "capture the flag"]
  # If any of these appears in the user message, auto mode exposes ALL tools:
  # a self-test must see producers and consumers together (e.g. fs.write AND
  # fs.read), or it loops on fixtures it cannot create.
  full_toolset_keywords: [selftest, self-test, "smoke test", "test the tools", "test all tools", "all the tools work"]
  keyword_namespaces:
    # CODING — code, lint, test, architect, code.delegate
    code: [code, implement, function, class, build, fix, bug, refactor, debug, patch, diff, script, test, pytest, lint, ruff, mypy, format, delegate, offload, coder, compile, error, traceback, exception, symbol, tree, deps, venv, dependency, install, run, execute, calculate, compute, math, regex, parse, convert]
    lint: [lint, ruff, mypy, format, "type check", eslint, flake8, black]
    test: ["unit test", "write test", "test suite", pytest, "run tests", asgi, "test coverage"]
    architect: [architect, plan, complex, "break down", decompose, design, "multi-file", "large task"]
    # FILES — writing, editing, grep, archives, pdf
    fs:   [write, edit, save, create, modify, grep, replace, "find and replace", file, folder, directory, move, rename, copy, delete, archive, zip, tar, extract, unzip, untar, pdf]
    archives: [archive, zip, tar, compress, extract, unzip, untar, bundle]
    pdf:  [pdf, "portable document"]
    # GIT
    git:  [git, commit, branch, stash, push, pull, fetch, merge, "pull request", checkout, restore, rebase, worktree, "work tree", diff, status, log, blame]
    # RESEARCH — deep research, scraping, arxiv, browser
    research: [research, "deep dive", investigate, "look into", "find everything", "dig into", thorough, "sourced report", literature, survey, "deep-dive"]
    web:  [scrape, extract, crawl, "structured data", paginated, render, headless, screenshot, "screen shot", capture, snapshot, arxiv, paper, "academic paper", api, rest, webhook, "http request", endpoint]
    browser: [screenshot, "screen shot", capture, "page to pdf", "save as pdf", snapshot, render]
    arxiv: [arxiv, paper, "academic paper", preprint, "machine learning paper"]
    # INFRA — serving, models, ops, jobs, eval, council
    serve: [serve, server, model, preset, "start model", "stop model", "model list", "swap model", slot, gpu, vram, "load model"]
    model: [model, preset, catalog, "model list", "switch model", swap]
    ops:   [ops, status, systemd, service, health, "is it running", uptime, rocm, systemctl]
    job:   [job, launch, detach, background, "long running", queue]
    eval:  [eval, compare, benchmark, "side by side", "model comparison", "self test", "self-test", "test yourself", "eval case", "behaviour test"]
    council: [council, debate, vote, "majority vote", self-consistency, "second opinion", "pros and cons", "trade-off", tradeoff, "should we", deliberate, panel, adversarial]
    agent: [fanout, "fan out", "in parallel", parallelize, "map-reduce", "map reduce", "several subtasks", "parallel subtasks"]
    schedule: [schedule, remind, reminder, cron, "every morning", "every day", "every hour", "in an hour", "later today", recurring]
    # KNOWLEDGE — rag, kg, memory writes, docs
    rag:   [rag, "knowledge base", retrieve, retrieval, indexed, collection, embeddings, "vector store", ingest]
    kg:    [knowledge, graph, relation, entity, "knowledge graph", ontology, "link between"]
    memory: [remember, forget, memory, "save for later", "note for next time", preference, memorize, "don't forget", "did we", "do you recall", "have we", "we discussed", "we talked about"]
    docs:  [summarize, summarise, digest, "bulk document", "all documents", "whole folder", "every file"]
    # CONTEXT — stage oversized text out of the conversation (context.stage)
    context: [stage, "too big", "too long", oversized, "out of context"]
    # VERIFICATION — verify, trace
    verify: [verify, score, rank, probe, judge, evaluate, quality, "good enough", "check quality", fable, "fable method", "fable loop", "fable judge", "prove it", "did that work", audit]
    trace: [trace, "what went wrong", "last run", "why did", debug, "earlier run", history, "previous run", failure, failed, yesterday, "last time", "last week", "last session", "this morning", "earlier today", recent, "what did we", "what happened", patterns, recurring, workflow]
    # INTEGRATION — mcp servers, chains
    mcp:   [mcp, "model context protocol", "mcp server", "mcp tool"]
    chain: [chain, pipeline, "multi-step pipeline", "run the chain"]
  max_tools: null

# Privacy enforcement. Tools marked `private: true` produce results
# that taint the run's context: a later remote-LLM call (see
# remote_llm_tools) then needs an explicit per-call human approval
# (privacy-flagged confirmation) unless `share_private: true` is set
# on the request. Refusals are per-call tool errors, not run-enders.
privacy:
  # Privacy is per-tool: each tool declares its own `private` flag, which is the
  # single source of truth (results from a private tool are never forwarded to a
  # remote LLM unless share_private is set). This list is an OPTIONAL additive
  # override to force extra namespaces private without editing tool code —
  # normally empty (the tool flags already cover fs, code, git, job, kg, memory,
  # rag, research, test, agent, archives, lint, trace).
  private_tool_namespaces: []
  # LLM tools that count as "remote" for privacy purposes.
  remote_llm_tools: [llm.call]

# Human-in-the-loop approval gate for state-changing and cloud-reaching calls.
confirmation:
  enabled: true              # master switch for the approval gate
  # CLI no-TTY fallback for the built-in prompt. deny = a gated call on a
  # non-interactive run (piped/cron/script) is REFUSED unless the caller
  # explicitly passes auto_confirm — unattended scripts must opt in knowingly.
  non_interactive: deny
  # Also pause for approval before any cloud LLM call (privacy.remote_llm_tools,
  # e.g. llm.call) — those send data off-box and cost money. The per-run
  # auto-approve toggle bypasses this like any other confirmation.
  confirm_cloud_calls: true

# Voice channel — the /api/voice endpoint used by native clients (e.g. the
# Android app). The phone does STT/TTS; JayNet stays text-in/text-out. With the
# default voice:true, replies are kept short and speech-friendly via the persona
# overlay, with thinking forced OFF and a tighter budget than the web chat for
# snappy turns. Chat clients pass voice:false: same server-managed conversation,
# but no persona overlay, thinking ON, and normal budgets/model (the safe
# unattended toolset — no confirmation-gated tools, no cloud llm.call — applies
# to both).
voice:
  enabled: true
  model: null                 # null = default brain; or a faster LiteLLM alias
  budget:
    max_iterations: 6
    max_wall_clock_s: 60
    max_cost_usd: 0.25
    max_total_tokens: 120000
  persona: |
    You are JayNet, answering by VOICE — your reply will be read aloud, so:
    - Be brief and conversational: usually 1–3 sentences.
    - Plain spoken language only. No markdown, code blocks, bullet lists, tables,
      or URLs. Spell things out in words a listener can follow.
    - If the full answer is long, give the key point first and offer to go deeper.
    - Don't read out raw IDs, hashes, file paths, or long numbers unless asked.

# Managed processes — launched on web server start, supervised with auto-restart.
# Replaces the systemd units for brain, embedding, and reranker.
# Logs are captured in-memory and viewable in the admin panel.
# kill_signal goes to the whole process GROUP; process_manager escalates to
# SIGKILL after a 5s grace — TERM (15) lets llama.cpp release VRAM cleanly.
processes:
  brain:
    command: scripts/start-model.sh brain      # relative to JAYNET_HOME
    restart: true
    restart_delay: 10
    kill_signal: 15
  specialist:
    command: scripts/start-model.sh specialist
    start_delay: 20
    restart: true
    restart_delay: 10
    kill_signal: 15
  # Optional extra specialists (local-specialist2/3 aliases). Their boot
  # slots ship EMPTY — assign a preset in admin → Presets (Boot model slots)
  # and they start on the next web restart; while empty they stay down.
  specialist2:
    command: scripts/start-model.sh specialist2
    start_delay: 25
    restart: true
    restart_delay: 10
    kill_signal: 15
  specialist3:
    command: scripts/start-model.sh specialist3
    start_delay: 30
    restart: true
    restart_delay: 10
    kill_signal: 15
  embed:
    command: scripts/start-model.sh embed
    start_delay: 5
    env:
      HIP_VISIBLE_DEVICES: ""
    restart: true
    restart_delay: 10
    kill_signal: 15
  rerank:
    command: scripts/start-model.sh rerank
    start_delay: 10
    env:
      HIP_VISIBLE_DEVICES: ""
    restart: true
    restart_delay: 10
    kill_signal: 15

# Tracing
trace:
  db_path: trace.db      # relative to JAYNET_DATA
  # Log full tool args/results (true) or just metadata (false)
  log_content: true
  # Prune runs (and their events) older than this many days, applied when the
  # runtime opens the DB. log_content=true makes the DB grow fast; this bounds
  # it and keeps trace.query snappy. 0 = keep everything forever.
  retention_days: 30

# Web console: login, per-user tool toggles, admin page.
web:
  tool_preview_chars: 8000   # max chars of a tool/skill result shown (expandable) in the UI
  chats_db: chats.db          # relative to JAYNET_DATA
  users_db: users.db
  # Set true when serving HTTPS (e.g. behind the nginx example); marks the
  # session cookie Secure. MUST stay false on plain HTTP — browsers never
  # send a Secure cookie back over HTTP, so login silently breaks.
  cookie_secure: false
  # Chat file/image uploads. Stored per-user under uploads_dir/<owner>/.
  uploads_dir: uploads
  max_upload_mb: 25
  # Backup restore (/api/admin/restore) uploads the whole data dir as one
  # .tar.gz (uploads, projects, wiki included) — deliberately much larger
  # than max_upload_mb.
  max_restore_mb: 1024
  # Files the agent hands back (deliver.files). Kept only if the chat is saved;
  # unsaved deliveries are swept after output_ttl_hours.
  outputs_dir: outputs
  output_ttl_hours: 24
  max_output_mb: 200
  # Projects: persistent per-user workspaces. Files live under
  # <projects_dir>/<owner>/<id>/files/ — and because that's under the data dir
  # (an fs allowed_root), the agent works on them with the normal fs.* tools.
  projects_dir: projects
  max_project_file_mb: 25
  # Per-chat scratch workspace: the agent's work_root (fs.*/code.* boundary) when
  # no project is active. Owner + conversation scoped, separate from deliverables.
  chat_scratch_dir: chat-scratch
  chat_scratch_ttl_hours: 336   # reclaim chat scratch untouched for 14 days
  # Extra endpoints probed on the admin status page (LiteLLM is always probed).
  # services:
  #   - {name: llama-server, url: "http://127.0.0.1:8090/health"}
  # First boot seeds an admin from JAYNET_ADMIN_USER / JAYNET_ADMIN_PASSWORD, or
  # generates a password and logs it once. Set JAYNET_SESSION_SECRET to keep
  # sessions valid across restarts; otherwise a secret is persisted to
  # data/session.secret. JAYNET_WEB_TOKEN still works as an API/CLI bearer.


# Tool-specific config
tools:
  # Hard per-tool-call timeout (seconds). The loop cancels any single tool call
  # that exceeds this and returns an error, so one misbehaving/blocking call can
  # never hang the run — a structural backstop on top of each tool's own timeouts
  # and the budget (which only bounds the loop between iterations). 0 disables.
  call_timeout_s: 180
  ops:
    # ops.run: trusted host validation (project venv + loopback, allowlisted, gated).
    allow: [pytest, python, python3, curl, systemctl, rocm-smi, nvidia-smi, ss, journalctl, cat, grep, ls, uv]
    venv_bin: .venv/bin        # relative to JAYNET_HOME
    project_root: .            # relative to JAYNET_HOME (the install root)
    loopback_only: true
    timeout_s: 120
    status:
      # ops.status: one-call stack health (do this before validating live services).
      services: [litellm-proxy, jaynet-web]
      pings:
        litellm: http://127.0.0.1:4000/v1/models
        brain:   http://127.0.0.1:8090/health
        gpu1:    http://127.0.0.1:8080/health
        embed:   http://127.0.0.1:8095/health
        rerank:  http://127.0.0.1:8096/health
  call_timeout_overrides:   # per-tool; 0 = no wrapper for that tool
    test.run: 600           # a full suite can legitimately run for minutes
    code.run: 600
    code.deps: 900          # dependency installs can be slow
    serve.start: 300        # loading a model server takes a while
    job.wait: 620           # its own internal cap is 600s
    # Sub-agent orchestrators: bounded by the BUDGET via their children (each
    # child's own tool calls are wrapped). A wrapper here would wrongly kill them
    # mid-run, so leave them un-timed.
    architect: 0
    agent.spawn: 0
    code.delegate: 0
    docs.summarize: 0
    web.crawl: 0
    web.extract: 0
    eval.compare: 0
    eval.run: 0
  web:    # Search backend priority (local first): SearxNG (if search_endpoint
    # set) -> Tavily (if TAVILY_API_KEY set) -> DuckDuckGo. Falls through on failure.
    tavily_enabled: true    # set false to ignore TAVILY_API_KEY even if present
    tavily_depth: basic     # "basic" (1 credit) or "advanced" (2 credits, deeper)
    # Self-hosted SearXNG (e.g. a LAN container) — uncomment and point at yours.
    # Needs "json" in search.formats in the container's settings.yml, else it
    # 403s the API requests.
    # search_endpoint: http://<your-searxng-host>:8888/search
    fetch_timeout_s: 15
    max_content_chars: 50000
    trafilatura_enabled: true   # main-content extraction for web.fetch (drops
                                # nav/footer/cookie boilerplate); false = plain tag-strip
    # web.render: headless-browser fetch for JS-rendered pages (SPAs, dashboards,
    # geoportals) that web.fetch can't read. Requires playwright + a chromium
    # binary on the host; the tool returns an actionable error if either is
    # missing. Defaults below work without this block.
    render:
      enabled: true
      headless: true
      wait_until: networkidle   # load | domcontentloaded | networkidle
      nav_timeout_s: 30

  # How web.render + the browser.* tools (screenshot, pdf) obtain a headless
  # browser. Playwright's BUNDLED Chromium is an Ubuntu build that does NOT run
  # on Arch/CachyOS, so pick ONE of:
  #   • ws_endpoint: a containerized Playwright over CDP (host stays clean,
  #     versions matched in the image) — PREFERRED for the service. e.g.
  #       docker run -d --rm -p 9222:9222 mcr.microsoft.com/playwright:v1.52.0-jammy \
  #         npx -y playwright run-server --port 9222 --host 0.0.0.0
  #     then set ws_endpoint: ws://127.0.0.1:9222/  (or env BROWSER_WS)
  #   • executable_path: the system Chromium (`sudo pacman -S chromium`).
  # If neither is set, the system binary is auto-detected on PATH; failing that,
  # Playwright's bundled build is used (fine on Ubuntu CI, broken on Arch).
  browser:
    enabled: true
    headless: true
    executable_path: /usr/bin/chromium   # Arch/CachyOS system Chromium
    ws_endpoint:                          # e.g. ws://127.0.0.1:9222/ (overrides executable_path)
    nav_timeout_s: 30
    # Cap for browser.screenshot return_image (the for-the-MODEL copy): bigger
    # images (e.g. tall full-page shots) are refused with a note, so one capture
    # can't drown the context. 2M px ≈ a 1280×1560 shot ≈ ~2-3k image tokens.
    model_image_max_pixels: 2000000
    # args: [--no-sandbox]                # only if running as root in a container

  schedule:
    enabled: true
    store: schedules.json      # relative to JAYNET_DATA
    tick_s: 30
    max_per_tick: 2            # due runs fired per tick (single-slot brain politeness)
    # Scheduled runs are unattended: gated tool calls auto-approve — consent was
    # given at schedule time (schedule.add is confirmation-gated). Cloud spend
    # is still bounded by the budget below.
    auto_confirm: true
    budget: {max_iterations: 12, max_cost_usd: 0.25, max_total_tokens: 250000}

  code:
    # Sandbox via firejail. Set to null to disable sandboxing (NOT recommended).
    sandbox: firejail
    timeout_s: 300
    # Interpreter for code.run python snippets. The runtime venv carries numpy; matplotlib
    # comes from requirements-tools.txt (Agg backend is forced; ORCH_EXEC_OUT
    # is the writable artifact dir for charts). 'python' = minimal system
    # interpreter.
    python: .venv/bin/python   # relative to JAYNET_HOME
    # Virtual-address-space cap for the sandbox (MB). numpy/matplotlib map big
    # buffers at import — 1 GB kills them (OpenBLAS alloc failure); 4 GB caps
    # runaways without touching real RSS.
    rlimit_as_mb: 4096
    # Mediated sub-LLM calls from inside code.run python snippets (the RLM primitive):
    # snippets get llm_query/llm_query_batched helpers that route through the
    # run's own model client over a per-run unix socket — budget-billed,
    # taint-gated (local-only when the run holds private results), logged to
    # the trace. Caps are per execution; model-written code multiplying LLM
    # calls is exactly the risk they bound.
    subcalls:
      enabled: true
      max_calls: 64            # per code.run python call
      max_concurrent: 4        # in-flight subcalls per run
      timeout_s: 240           # per subcall (incl. queue wait)
      max_output_tokens: 4096
      max_prompt_chars: 400000 # slice smaller above this — that's the point
    allowed_imports: [math, statistics, json, re, datetime, decimal, random, hashlib,
                      numpy, matplotlib]
    # Base for python-mode per-call sandbox dirs. MUST NOT be under /tmp:
    # firejail runs with --private-tmp (a fresh /tmp), which would hide a workdir
    # living under /tmp and break execution. Each call gets its own exec-* subdir
    # here, removed when the call finishes.
    workdir: code-sandbox      # relative to JAYNET_DATA
    # code.run — synchronous command runner for the inner dev loop. Confined to
    # the run's workspace (work_root: the active project's files dir, or the
    # per-chat scratch) and wrapped in sandbox_prefix (firejail, --net=none) by
    # default. Set sandbox_prefix: [] to disable the sandbox (then commands run
    # with full host access — NOT advised on a multi-user box; use job.start for
    # anything heavy/unsandboxed instead).
    run:
      # allowed_roots: [...]   # optional override; default is the run's work_root
      # (no default_cwd: cwd defaults to the work_root, so commands run there)
      timeout_s: 300
      max_output_chars: 12000
      allow_network: false        # if true, a call may pass network:true to drop --net=none
      # sandbox_prefix:           # uncomment to override the default firejail wrapper
      #   - firejail
      #   - --quiet
      #   - --private-tmp
      # code.deps installs into a per-project venv; no extra config needed.

    # code.devbox — per-run TOOLCHAIN CONTAINER for code.run. The firejail
    # sandbox only has what the host has, so "compile this Rust/Go/C#"
    # failed there. Build the image once (scripts/devbox-build.sh), then
    # enable. Each run gets its own --rm container (workspace bind-mounted,
    # idle-stopped after idle_ttl_s) with cargo/go/npm/nuget dependency
    # caches on shared volumes, so iterative builds stay fast. network:
    # toolchains need registries for real work — but the container's
    # network is cut automatically on private-tainted runs, so a snippet
    # can't curl workspace data out. Podman/image missing → falls back to
    # firejail.
    devbox:
      enabled: false
      image: jaynet-devbox:latest
      network: true
      idle_ttl_s: 1800
      env: null                      # extra env vars for every devbox exec, e.g. {FOO: bar} (per-call env wins)

    # code.delegate — offload coding to a sub-agent on a dedicated specialist model.
    # Serve a dense specialist on GPU 1 (serve.start) and register it as a LiteLLM
    # alias, then set `model` to that alias. With no model set, delegation still
    # works but runs on the default brain (no offload benefit). Add a costs row
    # for the alias name below (local models are free).
    delegate:
      model: local-specialist   # LiteLLM alias for the coding specialist. Resolution
                                # order: this alias → the LIVE specialist slot whose
                                # preset carries the `strength` tag below (allround
                                # counts) → the default brain. Set null to skip the
                                # pinned alias and always route by strengths.
      strength: coding        # preset strength tag code.delegate routes by when
                                # no alias is pinned above (allround counts too)
      # preset: presets/specialist-qwen2.5-coder-32b-dense.conf
      #   Optional. The preset (start-model.sh format) currently serving the
      #   specialist. When set (or via the JAYNET_SPECIALIST_PRESET env var), the
      #   web console shows the specialist's real model name + settings (context,
      #   endpoint, backend, KV cache) instead of just the alias — same source
      #   the brain uses.
      # tools: [...]             # override the default coding tool-set if desired
      # budget: {max_iterations: 30, max_total_tokens: 200000}
      default_iterations: 24  # child max_iterations when neither the call nor a
                                # `budget:` above sets one. The fleet-wide
                                # agent.default_sub_iterations (8) is sized for
                                # quick fan-out lookups; a delegate child must
                                # implement + run tests + fix + verify — 8 caps
                                # out mid-task and the brain falls back inline
                                # (seen live: tb-blind-maze-explorer-algorithm).
      # isolated: true           # default for the `isolated` call arg: run the coder
                                # in a throwaway git worktree (.jaynet-worktrees/),
                                # review/merge/discard the diff afterwards with the
                                # confirmation-gated git tools. Needs a git repo.

    # repomap — orientation pack prepended to coding sub-agent prompts
    # (code.delegate, architect plan/executor): a char-budgeted one-line-per-file
    # repo map plus the workspace's JAYNET.md/AGENTS.md/CLAUDE.md if present.
    repomap:
      enabled: true
      max_chars: 6000            # ≈1.5k tokens; truncated with an omission note

  # lint.run — fast static feedback (lint / format-check / type-check). Only the
  # tools actually installed are offered; extend or override the registry here.
  # Each entry maps a name to {check: [...argv], fix: [...argv]} with {path} sub'd.
  lint:
    timeout_s: 300
    # tools:
    #   pylint: {check: [pylint, "{path}"], fix: null}

  # gpu.status normally finds rocm-smi/amd-smi on PATH or in /opt/rocm/bin. Only
  # set these if the binaries live elsewhere or aren't on the service PATH.
  # gpu:
  #   rocm_smi_path: /opt/rocm/bin/rocm-smi
  #   amd_smi_path: /opt/rocm/bin/amd-smi
  #   bin_dirs: [/opt/rocm/bin]

  # serve.* — managed model servers on the GPUs. Defaults pin new servers to
  # GPU 1 (keep GPU 0 for the brain). A served LLM can be auto-registered as a
  # LiteLLM alias (needs the proxy to allow runtime model adds + LITELLM_MASTER_KEY)
  # so agent.spawn(model=...) / llm.call can target it for parallel local work.
  serve:
    state_dir: serve           # relative to JAYNET_DATA
    dispatcher: scripts/start-model.sh   # relative to JAYNET_HOME
    # serve.start invokes the dispatcher headless: start-model.sh --preset FILE.
    # In --preset mode the .conf owns the slot (its PORT/VISIBLE_DEVICES/ALIAS/
    # HOST keys); check presets with `start-model.sh --preset FILE --dry-run`.
    # Placeholders available: {dispatcher} {preset} {host} {port}.
    command_template: "{dispatcher} --preset {preset}"
    env_setup: ""                # absolute path to a GPU env script (e.g. RDNA4
    # overrides), sourced before launch when source_env is on; empty or missing
    # path = skipped silently. $VARS expand. Editable in Admin → Config.
    source_env: true
    default_cwd: work          # relative to JAYNET_DATA
    default_gpu: "1"
    host: 127.0.0.1
    port_base: 8091                        # first port tried; auto-increments
    reserved_ports: [8090, 4000]           # brain + LiteLLM
    health_timeout_s: 90                   # wait for /health before reporting ready
    min_free_vram_gib: 1.0                 # refuse to launch onto a near-full card
    litellm_admin_base: http://127.0.0.1:4000


  # rag.* — embedding + reranking. CPU-only llama-servers on :8095/:8096,
  # launched by the process manager (see processes: above) and pointed at
  # directly, not through LiteLLM. Any compatible endpoint works instead —
  # TEI/Infinity/Ollama/vLLM for embeddings, Cohere-style for rerank (see
  # docs/models.md). The reranker is
  # optional: rag.search orders by cosine similarity alone unless rerank_url is
  # set. With no collections indexed yet, neither server needs to be running —
  # rag.search returns a graceful "nothing indexed" result until you rag.index.
  rag:
    db_path: rag.db            # relative to JAYNET_DATA
    embed_url: http://127.0.0.1:8095/v1/embeddings
    embed_model: embedding        # arbitrary; llama-server serves whatever model is loaded
    rerank_url: http://127.0.0.1:8096/v1/rerank

  # mcp.* — bridge to Model Context Protocol servers (the wider MCP ecosystem:
  # filesystem, GitHub, databases, …). Needs the optional `mcp` package
  # (requirements-tools.txt). Easiest managed in Admin → MCP
  # (stored as a config override, active immediately); the YAML below works
  # too. Each server is EITHER a stdio subprocess
  # (command/args/env — env is merged over the SCRUBBED base env, so no
  # orchestrator secrets leak) OR a streamable-HTTP endpoint (url). Calls are
  # confirmation-gated per call by default; `confirm: false` opts out for a
  # trusted, read-only server. Results are private (never flow to a cloud LLM
  # unless the run allows private sharing).
  mcp:
    timeout_s: 30
    servers: {}
    # servers:
    #   filesystem:
    #     command: npx
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/data"]
    #   internal-api:
    #     url: http://192.168.1.10:8000/mcp
    #     confirm: false

  # Deep-research state spine (the `research.*` tools + deep-research skill).
  # Holds the frontier, visited/dedup set, budgets and claims; the crawl itself
  # reuses web.* + rag.* + agent.spawn. Findings land in a RAG collection named
  # research_<run_id> (retained after the run; delete with rag.delete).
  research:
    db_path: research.db       # relative to JAYNET_DATA
    novelty_stall: 3              # stop after N cycles that add no new sources
    # Semantic dedup: embed each kept page (via the RAG embedder) and drop pages
    # that are too close to one already kept — collapses "same facts, different
    # words" that the content hash misses. Degrades to hash-only if the embedder
    # is down. Needs the embedding server (same as rag.*).
    semantic_dedup: true
    dedup_threshold: 0.92         # cosine >= this -> treated as a duplicate
    dedup_prefix_chars: 2000      # page signature = first N chars (whitespace-normalized)
    # Source-quality tiers extend the built-in heuristic (host-suffix match).
    # high -> 0.9, medium -> 0.7, low -> 0.3, deny -> 0.0 (skip), unknown -> 0.5.
    # high:   [your-trusted-domain.org]
    # medium: []
    # low:    []
    # deny:   []                  # never crawl/cite these


  # The testing harness (test.run): lets the agent test code like a developer —
  # write a pytest module that drives a FastAPI app in-process via httpx
  # ASGITransport with the model mocked, run it, read pass/fail.
  test:
    # Interpreter that has the test deps (pytest, pytest-asyncio, httpx, fastapi).
    # See requirements-test.txt. The default below is the orchestrator's own
    # venv (relative to JAYNET_HOME).
    python: .venv/bin/python   # relative to JAYNET_HOME
    # Prepended to PYTHONPATH so tests can `import web.server`, `runtime.*`, etc.
    project_root: .            # relative to JAYNET_HOME (the install root)
    extra_pythonpath: ""
    # Where per-run workdirs are created (quick runs are cleaned up; detached
    # runs persist here next to the job logs).
    workdir_root: test-runs    # relative to JAYNET_DATA
    quick_timeout_s: 120
    # Optional sandbox wrapper for the quick path, e.g.
    #   [firejail, --quiet, --private-tmp]
    # Left empty by default; unlike code.run python mode, tests may need their deps and
    # (occasionally) network, so no --net=none here.
    sandbox_prefix: []

# Rough cost table for budget tracking (USD per 1M tokens).
# ⚠️ PLACEHOLDER PRICING — verify against each provider's pricing page. Every
# model_name in litellm.yaml needs a row here or budget.add_usage() silently
# bills $0 for it. Local model is free.
# Cloud rows are the SEED for the DB cloud catalog (admin → Presets → Cloud
# models); afterwards the DB wins and edits here have no effect.
costs:
  local-orchestrator: {input: 0,    output: 0}
  # Local specialist served on GPU 1 (code.delegate target). Local => free. Name must
  # match the LiteLLM model_name AND tools.code.delegate.model.
  local-specialist:        {input: 0,    output: 0}
  # Cloud models ($/M tokens)
  kimi-k3:            {input: 3,    output: 15}     # kimi: preferred frontier (Moonshot K3; cached in ≈$0.30 via the 0.1 factor)
  glm-5.2:            {input: 0.93, output: 3}      # glm: coding + 1M context (Z.ai / OpenRouter)
  gemini-pro:         {input: 2,    output: 12}     # gemini: reasoning
  qwen-plus:          {input: 0.40, output: 1.20}   # qwen: cheap checks

verify:
  # LLM-as-a-verifier (continuous logprob-expectation scores). The verifier is a
  # LiteLLM alias, resolved: verify.model (here) -> JAYNET_VERIFIER_MODEL (.env) ->
  # the brain (orchestrator.model). Point JAYNET_VERIFIER_MODEL at a specialised
  # local verifier alias when you have one — no code change needed.
  model: null
  scale: numeric         # 0-9 grade (higher=better). Sidesteps the A=best prior
                         # that inverts a letter scale. Use 'letters' (A..) only if needed.
  constrain: true        # force the verifier to emit exactly one grade char via a
                         # llama.cpp GBNF grammar — defeats a chatty/thinking model that
                         # writes prose before the grade. Set false for a cloud verifier.
  min_grade_mass: 0.5    # a position counts as the grade only if grade tokens hold >=50%
                         # of its probability mass — rejects incidental digits/letters.
  no_think: true         # disable the verifier's chain-of-thought so the grade is the
                         # first token (reasoning models emit thinking otherwise). Keep on.
  granularity: 20        # G: grade levels (single-token letters A..). Higher = sharper separation.
  repeats: 1             # K: evals averaged. 1 already strong; raise to cut variance.
  criteria:              # default decomposition when a caller passes none
    - "Correctness: factually and logically correct for the task."
    - "Completeness: fully addresses everything the task asks for."
    - "Quality: clear, well-structured, and free of errors."

council:
  # council.debate default panel (aliases or {model, persona}). Caller can override
  # per call and pass personas. Add a cloud alias here or per-call for a 3rd voice.
  panel: [local-orchestrator, local-specialist]
  rounds: 2              # round 1 opens; the rest rebut/revise
  max_tokens: 1200       # per panelist per round
  synthesizer: null      # who writes the final summary; null -> the brain

plugins:
  # Optional capability bundles (runtime/plugins.py). Two layers: builtins
  # shipped in-repo under plugins/ (default DISABLED — they usually need extra
  # pip packages) and admin-installed ones under DATA/plugins (default enabled).
  # Flip enabled here or via admin -> Plugins, then restart jaynet-web —
  # plugins load at startup only. Per-plugin settings live under the plugin's
  # own key and reach it via ctx.config["plugins"][<name>].
  graphify:
    enabled: false           # per-project knowledge graphs (needs: pip install graphifyy)
    model: local-specialist  # LiteLLM alias for the semantic pass (docs/PDFs);
                             # point at a cloud alias only if the project's files
                             # may leave the box — code extraction is always local.
    token_budget: 4000       # per-chunk tokens for the semantic pass (local models)
    max_concurrency: 2       # parallel LLM chunks (keep low for local inference)
    max_output_tokens: 8192  # per-call output cap — THE speed lever: the extractor
                             # generates until this cap; 8192 out ≈ 8 min/chunk on a
                             # 27B dense, much less on the MoE brain. Lower it or pick
                             # a faster 'model' alias for big doc piles.
    label_communities: false # name graph communities via an LLM pass (uses 'model'
                             # above); off = numeric community ids, no extra calls
    auto_rebuild: false      # rebuild a project's graph automatically after file
                             # changes (debounced, see below). Only projects that
                             # already HAVE a graph — a first build is always manual.
    auto_rebuild_delay_s: 120 # quiet seconds before the auto-rebuild starts
    wiki_nodes: true         # deterministic wiki extractor: the project wiki
                             # (files/wiki/) becomes one node per page + link edges
                             # in the project graph. Free (no LLM), opt-out.
