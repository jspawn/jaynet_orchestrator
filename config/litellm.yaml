# LiteLLM proxy config — unified OpenAI-compatible API on :4000
# Backends: local llama.cpp + cloud models via direct provider APIs.
#
# Current cloud models (3):
#   glm-5.2   → Z.ai GLM 5.2         (coding, 1M context)
#   gemini-pro → Google Gemini 3.5     (reasoning)
#   qwen-plus → Alibaba Qwen 3.6 Plus (cheap checks)
#
# To switch to OpenRouter as a single provider, comment out the
# "DIRECT PROVIDER" sections and uncomment the "OPENROUTER" section below.
#
# ⚠️  Model ids verified against provider docs July 2026. They drift fast —
#     confirm each `model:` against the provider's current catalog.

model_list:
  # ===================== LOCAL ORCHESTRATOR =====================
  # The `model` id must match the brain preset's served id (runtime.yaml
  # models.presets.brain.served_id) — the mismatch check compares them.
  - model_name: local-orchestrator
    litellm_params:
      model: openai/Hermes3.6-35B-A3B-uncens-genesis-V4-APEX
      api_base: http://127.0.0.1:8090/v1
      api_key: "not-needed"
      max_tokens: 131072

  # ===================== LOCAL CODER (code.delegate target) =====================
  # Dedicated coder on GPU 1 (:8080). Keep the alias in sync with
  # runtime.yaml: tools.code.delegate.model AND the $0 costs: row.
  - model_name: local-coder
    litellm_params:
      model: openai/qwen3.6-27B-davidAU
      api_base: http://127.0.0.1:8080/v1
      api_key: "not-needed"
      max_tokens: 131072

  # ===================== DIRECT PROVIDERS =====================
  # One key per provider. Comment this section and uncomment the
  # OpenRouter section below to consolidate to a single provider.

  # --- Z.ai (GLM) ---
  # General API endpoint. For Coding Plan: /api/coding/paas/v4 (not interchangeable).
  # Sign up at z.ai → API Keys → Create Key. Add ZAI_API_KEY to orchestrator.env.
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/paas/v4

  # --- Google (Gemini) ---
  # As of Jul 2026: gemini-3.5-pro may still be in preview rollout.
  # If it 400s, try gemini-3.1-pro or gemini-3.5-pro-preview.
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # --- Alibaba DashScope (Qwen) ---
  # International endpoint; for Beijing: https://dashscope.aliyuncs.com/compatible-mode/v1
  - model_name: qwen-plus
    litellm_params:
      model: dashscope/qwen3.6-plus
      api_key: os.environ/DASHSCOPE_API_KEY
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  # ===================== OPENROUTER (single provider) =====================
  # Uncomment this section and comment out the DIRECT PROVIDERS section
  # above to route all three cloud models through OpenRouter.
  # One API key (OPENROUTER_API_KEY), one invoice, auto-failover.
  #
  # Sign up: https://openrouter.ai  →  Keys  →  Create Key
  # Add to orchestrator.env: OPENROUTER_API_KEY=sk-or-...
  #
  # Pricing (as of Jul 2026, per M tokens):
  #   GLM 5.2:       $1.40 in / $4.40 out  (25 providers, auto-routed)
  #   Gemini 3.5:    ~$2 in / ~$12 out
  #   Qwen 3.6 Plus: $0.33 in / $1.95 out  (free during preview!)
  #
  # - model_name: glm-5.2
  #   litellm_params:
  #     model: openrouter/z-ai/glm-5.2
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     api_base: https://openrouter.ai/api/v1
  #
  # - model_name: gemini-pro
  #   litellm_params:
  #     model: openrouter/google/gemini-3.5-pro
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     api_base: https://openrouter.ai/api/v1
  #
  # - model_name: qwen-plus
  #   litellm_params:
  #     model: openrouter/qwen/qwen3.6-plus
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     api_base: https://openrouter.ai/api/v1

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  fallbacks:
    # Cloud models fall back to the free local brain on failure.
    - glm-5.2:       ["qwen-plus", "local-orchestrator"]
    - gemini-pro:    ["qwen-plus", "local-orchestrator"]
    - qwen-plus:     ["local-orchestrator"]
    # If the local coder is down, degrade to the brain.
    - local-coder:   ["local-orchestrator"]

litellm_settings:
  cache: true
  cache_params:
    type: local
    ttl: 600
  set_verbose: false
  drop_params: true
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database_url: runs stateless (no Prisma). Cost/usage tracked by
  # the orchestrator's own trace.db, so LiteLLM's spend DB is redundant.
  ui_access_mode: "admin_only"
