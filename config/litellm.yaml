# LiteLLM proxy config — unified OpenAI-compatible API on :4000
# Backends: local llama.cpp + Claude + Gemini + Qwen.
#
# ⚠️  Model ids and provider prefixes verified against provider docs on
#     July 1, 2026. They drift fast — confirm each `model:` against the
#     provider's current catalog before relying on it. Add more providers
#     later by adding a model_name block + a costs: row in runtime.yaml + an
#     env key; remove one by deleting its block (and any fallback that names it).
#
# Provider prefixes: anthropic/  gemini/  dashscope/ (Qwen)
#                    openai/ + api_base  ->  local llama.cpp

model_list:
  # ===================== LOCAL ORCHESTRATOR =====================
  - model_name: local-orchestrator
    litellm_params:
      model: openai/qwen3-30b-a3b
      api_base: http://127.0.0.1:8090/v1
      api_key: "not-needed"
      max_tokens: 131072
      
  - model_name: local-orchestrator            # GPU-1 brain (parallel instance)
    litellm_params:
      model: openai/qwen3-30b-a3b             # same served id as the :8090 brain
      api_base: http://127.0.0.1:8091/v1
      api_key: "not-needed"
      max_tokens: 131072

  # ===================== LOCAL CODER (code.delegate target) =====================
  # The dedicated coder served by llama-coder.service on GPU 1 (:8080) — now
  # Ornith-1.0-35B (deepreinforce-ai), a Qwen3.5-MoE RL-trained for agentic coding.
  # Same local-llama.cpp pattern as the brain (openai/ prefix + api_base). The
  # `model` id after openai/ is cosmetic for a single-model llama-server. Keep the
  # public alias (model_name) in sync with runtime.yaml: tools.code.delegate.model
  # AND a $0 costs: row both named `local-coder`. (Distinct from the cloud
  # `qwen-coder` below, which is Alibaba DashScope, not local.)
  # NOTE: Ornith is a REASONING model — it emits <think> blocks and needs a
  # reasoning parser + a qwen3 XML/coder tool-call parser, plus Ornith's own
  # chat template. Make sure llama-coder.service serves it with those, or
  # code.delegate's sub-agent will mis-parse <think>/<tool_call> output.
  - model_name: local-coder
    litellm_params:
      model: openai/ornith-1.0-35b
      api_base: http://127.0.0.1:8080/v1
      api_key: "not-needed"
      max_tokens: 131072

  # ===================== ANTHROPIC (Claude) =====================
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ===================== GOOGLE (Gemini) =====================
  # 3.5 Pro still not GA as of Jul 1 2026 (Google rolling it out) — 3.1 Pro
  # remains the current Pro tier. NOTE: catalogs list it as gemini-3.1-pro-preview;
  # if gemini-3.1-pro 400s, switch to the -preview id. gemini-3.5-flash is GA and
  # backs gemini-flash-latest.
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ===================== QWEN (Alibaba DashScope) =====================
  # OpenAI-compatible. International endpoint shown; for the Beijing region
  # swap api_base to https://dashscope.aliyuncs.com/compatible-mode/v1
  # As of Jul 2026 the 3.7 tiers are GA. ⚠️  3.6/3.7 are HYBRID-THINKING: max/plus
  # emit reasoning (reasoning_content) by default — llm.call disables it for the
  # fast/coder tiers, but a sub-agent run directly on qwen-max/plus will emit a
  # chain-of-thought (cost + <think> output). Confirm the exact snapshot ids in
  # the Model Studio catalog; they move monthly.
  - model_name: qwen-max
    litellm_params:
      model: dashscope/qwen3.7-max
      api_key: os.environ/DASHSCOPE_API_KEY
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  - model_name: qwen-plus
    litellm_params:
      model: dashscope/qwen3.7-plus
      api_key: os.environ/DASHSCOPE_API_KEY
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  - model_name: qwen-flash
    litellm_params:
      model: dashscope/qwen3.6-flash
      api_key: os.environ/DASHSCOPE_API_KEY
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  # Dedicated coder; note Alibaba now suggests a general model (e.g. qwen-plus)
  # over the Coder line for many tasks.
  - model_name: qwen-coder
    litellm_params:
      model: dashscope/qwen3-coder-next
      api_key: os.environ/DASHSCOPE_API_KEY
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  # If a model errors/rate-limits, fall through these. Chains end at the free
  # local model so a run degrades gracefully instead of hard-failing.
  fallbacks:
    - claude-opus:   ["claude-sonnet", "claude-haiku"]
    - claude-sonnet: ["claude-haiku", "qwen-plus", "local-orchestrator"]
    - gemini-pro:    ["gemini-flash", "local-orchestrator"]
    - qwen-max:      ["qwen-plus", "local-orchestrator"]
    - qwen-plus:     ["qwen-flash", "local-orchestrator"]
    - qwen-coder:    ["qwen-plus", "local-orchestrator"]
    # If the local coder is down (service stopped / model reloading), delegation
    # degrades to the brain instead of hard-failing.
    - local-coder:   ["local-orchestrator"]

litellm_settings:
  cache: true
  cache_params:
    type: local
    ttl: 600
  set_verbose: false
  drop_params: true
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database_url: runs the proxy stateless (no Prisma/DB needed). Cost/usage
  # is tracked by the orchestrator's own trace.db (runtime/trace.py), so
  # LiteLLM's spend DB would be redundant. Adding a database_url here makes
  # LiteLLM try to init Prisma at startup and crash unless prisma is installed.
  ui_access_mode: "admin_only"
