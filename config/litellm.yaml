# LiteLLM proxy config — unified OpenAI-compatible API on :4000
# Backends: local llama.cpp + cloud models via direct provider APIs.
#
# Current cloud models (4):
#   kimi-k3    → Moonshot Kimi K3       (preferred frontier, 1M context)
#   glm-5.2    → GLM 5.2 via OpenRouter (coding, 1M context)
#   gemini-pro → Google Gemini 3.5      (reasoning)
#   qwen-plus  → Alibaba Qwen 3.6 Plus  (cheap checks)
#
# Hybrid routing: kimi/gemini/qwen go DIRECT to their providers, glm goes
# through OPENROUTER. To consolidate everything on OpenRouter, comment the
# DIRECT PROVIDERS blocks and uncomment the parked OPENROUTER entries.
#
# ⚠️  Model ids verified against provider docs July 2026. They drift fast —
#     confirm each `model:` against the provider's current catalog.

model_list:
  # ===================== LOCAL ORCHESTRATOR =====================
  # The `model` id must match the brain preset's served id (runtime.yaml
  # models.presets.brain.served_id) — the mismatch check compares them.
  - model_name: local-orchestrator
    litellm_params:
      model: openai/qwen3-4b
      api_base: http://127.0.0.1:8090/v1
      api_key: "not-needed"
      max_tokens: 32768

  # ===================== LOCAL SPECIALIST (code.delegate target) ==============
  # Dedicated specialist on GPU 1 (:8080). Keep the alias in sync with
  # runtime.yaml: tools.code.delegate.model AND the $0 costs: row.
  - model_name: local-specialist
    litellm_params:
      model: openai/qwen3.6-27B-davidAU
      api_base: http://127.0.0.1:8080/v1
      api_key: "not-needed"
      max_tokens: 131072

  # ===================== DIRECT PROVIDERS =====================
  # One key per provider. Comment this section and uncomment the
  # OpenRouter section below to consolidate to a single provider.

  # --- Moonshot (Kimi) ---
  # K3: frontier MoE, 1M context, always-on reasoning, native vision — the
  # preferred cloud model. Intl endpoint; for China: https://api.moonshot.cn/v1.
  # Add MOONSHOT_API_KEY to orchestrator.env.
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.ai/v1

  # --- Z.ai (GLM) — RETIRED: glm-5.2 runs via OpenRouter (see below). ---
  # To go direct again: restore this block and set ZAI_API_KEY in the env.
  # General API endpoint; for the Coding Plan use /api/coding/paas/v4 instead.

  # --- Google (Gemini) ---
  # As of Jul 2026: gemini-3.5-pro may still be in preview rollout.
  # If it 400s, try gemini-3.1-pro or gemini-3.5-pro-preview.
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # --- Alibaba DashScope (Qwen) ---
  # International endpoint; for Beijing: https://dashscope.aliyuncs.com/compatible-mode/v1
  - model_name: qwen-plus
    litellm_params:
      model: dashscope/qwen3.6-plus
      api_key: os.environ/DASHSCOPE_API_KEY
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  # ===================== OPENROUTER =====================
  # glm-5.2 is LIVE via OpenRouter (single key: OPENROUTER_API_KEY).
  # Sign up: https://openrouter.ai → Keys → Create Key.
  # The kimi/gemini/qwen entries below are PARKED — uncomment them and
  # comment their DIRECT PROVIDERS blocks to consolidate on OpenRouter
  # (one key, one invoice, auto-failover).
  #
  # Pricing (as of Jul 2026, per M tokens):
  #   GLM 5.2:       $1.40 in / $4.40 out  (25 providers, auto-routed)
  #   Gemini 3.5:    ~$2 in / ~$12 out
  #   Qwen 3.6 Plus: $0.33 in / $1.95 out  (free during preview!)
  - model_name: glm-5.2
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
  #
  # - model_name: gemini-pro
  #   litellm_params:
  #     model: openrouter/google/gemini-3.5-pro
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     api_base: https://openrouter.ai/api/v1
  #
  # - model_name: qwen-plus
  #   litellm_params:
  #     model: openrouter/qwen/qwen3.6-plus
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     api_base: https://openrouter.ai/api/v1

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  fallbacks:
    # Cloud models fall back to the free local brain on failure.
    - kimi-k3:       ["gemini-pro", "glm-5.2", "local-orchestrator"]
    - glm-5.2:       ["qwen-plus", "local-orchestrator"]
    - gemini-pro:    ["qwen-plus", "local-orchestrator"]
    - qwen-plus:     ["local-orchestrator"]
    # If the local specialist is down, degrade to the brain.
    - local-specialist:   ["local-orchestrator"]

litellm_settings:
  cache: true
  cache_params:
    type: local
    ttl: 600
  set_verbose: false
  drop_params: true
  request_timeout: 120

general_settings:
  # Optional: omit when the proxy is localhost-only (it binds 127.0.0.1) — a
  # keyless proxy enforces no auth. The generated config renders this line
  # only when LITELLM_MASTER_KEY is set.
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database_url: runs stateless (no Prisma). Cost/usage tracked by
  # the orchestrator's own trace.db, so LiteLLM's spend DB is redundant.
  ui_access_mode: "admin_only"
