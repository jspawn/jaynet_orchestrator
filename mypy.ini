# mypy configuration — used by scripts/check_mypy.sh (the CI baseline gate).
# python_version pins the typeshed render target so every host (CI legs
# 3.11/3.14, dev machines) produces identical error messages — without it,
# e.g. int() renders with/without SupportsTrunc per interpreter.
[mypy]
python_version = 3.11

# numpy's installed stubs use 3.12+ `type` statements, which fail to PARSE
# under python_version 3.11 on hosts with a new numpy (fatal: "errors
# prevented further checking"). We don't type-check against numpy — skip it.
[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True
